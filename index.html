<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Ozon 类目属性助手 v6.5（智能上传版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-7xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">📦 Ozon 类目属性助手 v6.5（商品上传一体化）</h1>

    <!-- 顶部控制区 -->
    <div class="flex flex-wrap gap-3 items-center mb-6">
      <button id="btnPing" class="px-4 py-2 bg-gray-700 text-white rounded hover:bg-gray-800">验证 API 连接</button>
      <span id="pingStatus" class="text-sm text-gray-600"></span>

      <label class="ml-4 text-sm">语言：</label>
      <select id="lang" class="border rounded px-2 py-1">
        <option value="ZH_HANS">ZH_HANS（中文）</option>
        <option value="RU">RU（俄语）</option>
      </select>

      <button id="btnTree" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">获取类目树</button>
      <button id="btnClearCache" class="px-4 py-2 bg-orange-600 text-white rounded hover:bg-orange-700">清除缓存</button>
    </div>

    <!-- 类目选择 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
      <select id="c1" class="border rounded px-3 py-2"><option>请选择一级类目</option></select>
      <select id="c2" class="border rounded px-3 py-2"></select>
      <select id="c3" class="border rounded px-3 py-2"></select>
    </div>

    <!-- 属性区域 -->
    <div id="attrPanel" class="bg-white p-4 rounded-xl shadow mb-6">
      <div id="attrLoading" class="text-sm text-gray-500">尚未加载属性...</div>
      <div id="attrList" class="hidden">
        <input id="attrSearch" class="border rounded px-3 py-1 text-sm mb-3 w-full" placeholder="搜索属性..." />
        <div id="attrCards" class="space-y-3"></div>
      </div>
    </div>

    <!-- 上传商品表单 -->
    <div class="bg-white p-4 rounded-xl shadow">
      <h2 class="text-lg font-semibold mb-3">🧾 商品上传</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <input id="offer_id" placeholder="商品唯一标识 offer_id" class="border rounded px-3 py-2" />
        <input id="name" placeholder="商品名称" class="border rounded px-3 py-2" />
        <input id="barcode" placeholder="条形码" class="border rounded px-3 py-2" />
        <input id="price" placeholder="价格" class="border rounded px-3 py-2" />
        <select id="currency" class="border rounded px-3 py-2">
          <option value="RUB">RUB</option>
          <option value="CNY">CNY</option>
        </select>
        <input id="vat" placeholder="增值税率（0 或 20）" class="border rounded px-3 py-2" />
        <input id="depth" placeholder="深度 cm" class="border rounded px-3 py-2" />
        <input id="width" placeholder="宽度 cm" class="border rounded px-3 py-2" />
        <input id="height" placeholder="高度 cm" class="border rounded px-3 py-2" />
        <input id="weight" placeholder="重量 kg" class="border rounded px-3 py-2" />
      </div>

      <textarea id="images" placeholder="图片链接（每行一张，最多30张）" rows="3" class="border rounded px-3 py-2 mt-3 w-full"></textarea>

      <button id="btnUpload" class="mt-4 px-5 py-2 bg-green-600 text-white rounded hover:bg-green-700">🚀 发布商品</button>
      <pre id="uploadResult" class="mt-3 text-sm bg-gray-100 p-3 rounded overflow-x-auto"></pre>
    </div>
  </div>

  <script>
    const ozon = async (endpoint, body = null) => {
      const opts = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {};
      const res = await fetch('/api/ozon-proxy?endpoint=' + encodeURIComponent(endpoint), opts);
      return await res.json();
    };

    let TREE = [], ATTRS = [];
    const $ = (id) => document.getElementById(id);

    // 验证 API
    $('btnPing').onclick = async () => {
      $('pingStatus').textContent = '检测中...';
      try {
        const r = await ozon('/v1/description-category/tree', { language: 'RU' });
        $('pingStatus').textContent = '✅ 连接正常，共 ' + (r.result?.length || 0) + ' 类目';
      } catch (e) {
        $('pingStatus').textContent = '❌ ' + e.message;
      }
    };

    // 获取类目树
    $('btnTree').onclick = async () => {
      $('attrList').classList.add('hidden');
      $('attrLoading').textContent = '正在加载类目树...';
      try {
        const r = await ozon('/v1/description-category/tree', { language: $('lang').value });
        TREE = r.result || [];
        fillSelect($('c1'), TREE, '请选择一级类目');
        $('attrLoading').textContent = '✅ 类目树加载成功';
      } catch (e) {
        $('attrLoading').textContent = '❌ ' + e.message;
      }
    };

    // 清除缓存
    $('btnClearCache').onclick = () => {
      localStorage.clear();
      alert('缓存已清除');
    };

    // 填充下拉框
    const fillSelect = (sel, arr, ph) => {
      sel.innerHTML = `<option value="">${ph}</option>` + arr.map(x => `<option value="${x.description_category_id}">${x.category_name}</option>`).join('');
    };

    // 联动加载
    $('c1').onchange = () => {
      const c1 = TREE.find(x => x.description_category_id == $('c1').value);
      fillSelect($('c2'), c1?.children || [], '请选择二级类目');
      $('c3').innerHTML = '<option>请选择三级类型</option>';
    };
    $('c2').onchange = () => {
      const c1 = TREE.find(x => x.description_category_id == $('c1').value);
      const c2 = c1?.children?.find(x => x.description_category_id == $('c2').value);
      fillSelect($('c3'), c2?.children || [], '请选择三级类型');
    };
    $('c3').onchange = async () => {
      const c2 = Number($('c2').value), type = Number($('c3').value);
      $('attrLoading').textContent = '正在加载属性...';
      const r = await ozon('/v1/description-category/attribute', {
        description_category_id: c2,
        type_id: type,
        language: $('lang').value
      });
      ATTRS = r.result || [];
      renderAttrs();
    };

    // 渲染属性
    function renderAttrs() {
      $('attrList').classList.remove('hidden');
      $('attrLoading').classList.add('hidden');
      ATTRS.sort((a, b) => b.is_required - a.is_required);
      $('attrCards').innerHTML = ATTRS.map(a => `
        <div class="p-3 rounded border ${a.is_required ? 'bg-red-50 border-red-300' : 'bg-gray-50'}">
          <div class="flex justify-between"><b>${a.name}</b>${a.is_required ? '<span class="text-red-500">(必填)</span>' : ''}</div>
          ${a.dictionary_id > 0
            ? `<input list="dict-${a.id}" id="attr-${a.id}" class="border w-full px-2 py-1 mt-1 rounded" placeholder="搜索并选择..." />
               <datalist id="dict-${a.id}"></datalist>
               <script>ozon('/v1/description-category/attribute/values',{attribute_id:${a.id},description_category_id:${$('c2').value},type_id:${$('c3').value},language:'${$('lang').value}'}).then(r=>{
                 const d=document.getElementById('dict-${a.id}');
                 d.innerHTML=r.result.map(v=>'<option value="'+v.value+'">').join('');
               });<\/script>`
            : `<input id="attr-${a.id}" class="border w-full px-2 py-1 mt-1 rounded" placeholder="输入值..." />`}
        </div>
      `).join('');
    }

    // 上传商品
    $('btnUpload').onclick = async () => {
      const images = $('images').value.split('\n').filter(Boolean);
      const attrs = ATTRS.map(a => ({
        id: a.id,
        values: [{ value: $('attr-' + a.id)?.value || '' }]
      })).filter(x => x.values[0].value);
      const payload = {
        items: [{
          offer_id: $('offer_id').value,
          name: $('name').value,
          barcode: $('barcode').value,
          price: $('price').value,
          currency_code: $('currency').value,
          vat: $('vat').value,
          depth: $('depth').value,
          width: $('width').value,
          height: $('height').value,
          weight: $('weight').value,
          dimension_unit: 'cm',
          weight_unit: 'kg',
          images,
          attributes: attrs
        }]
      };
      $('uploadResult').textContent = '正在上传商品...';
      try {
        const r = await ozon('/v3/product/import', payload);
        $('uploadResult').textContent = JSON.stringify(r, null, 2);
      } catch (e) {
        $('uploadResult').textContent = '❌ ' + e.message;
      }
    };
  </script>
</body>
</html>
