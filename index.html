<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Ozon 类目属性助手（中文类目三级下拉 + 自动标注必填/选填）</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tailwindcss-jit-cdn"></script>
</head>
<body class="bg-gray-50 p-6 text-gray-800">
  <h1 class="text-xl font-bold mb-4">🛒 Ozon 类目属性助手（中文类目三级下拉 + 自动标注必填/选填）</h1>

  <!-- 操作栏 -->
  <div class="flex flex-wrap gap-2 mb-4 items-center">
    <select id="lang" class="border px-2 py-1 rounded">
      <option value="ZH_HANS">ZH_HANS（中文）</option>
      <option value="RU">RU（俄语）</option>
    </select>
    <button id="testProxy" class="bg-blue-600 text-white px-3 py-1 rounded">测试代理</button>
    <button id="loadTree" class="bg-green-600 text-white px-3 py-1 rounded">获取类目树</button>
    <label class="ml-4 text-sm"><input type="checkbox" id="onlyRequired" class="mr-1">仅显示必填项</label>
  </div>

  <!-- 类目选择 -->
  <div class="flex flex-wrap gap-2 mb-4">
    <select id="level1" class="border px-2 py-1 rounded w-48"><option>加载中...</option></select>
    <select id="level2" class="border px-2 py-1 rounded w-48"></select>
    <select id="level3" class="border px-2 py-1 rounded w-48"></select>
    <button id="loadAttrs" class="bg-indigo-600 text-white px-3 py-1 rounded">刷新属性</button>
  </div>

  <!-- 状态栏 -->
  <div id="status" class="text-sm text-gray-600 mb-2">尚未加载。</div>

  <!-- 属性搜索 -->
  <input id="searchAttr" placeholder="搜索属性..." class="border px-3 py-2 rounded w-full mb-3" />

  <!-- 属性展示区 -->
  <div id="attrBox" class="grid gap-3"></div>

<script>
const API = "/v1";
let LANG = "ZH_HANS";
let treeData = [];
let currentC1 = 0, currentC2 = 0, currentType = 0;
let ATTR_ALL = [];

// 通用 API 请求封装
async function ozon(path, data={}) {
  const url = API + path;
  const res = await axios.post(url, data).then(r=>r.data);
  return res.data || res;
}

// 初始化
const $lang = document.getElementById("lang");
const $testProxy = document.getElementById("testProxy");
const $loadTree = document.getElementById("loadTree");
const $status = document.getElementById("status");
const $onlyRequired = document.getElementById("onlyRequired");
const $level1 = document.getElementById("level1");
const $level2 = document.getElementById("level2");
const $level3 = document.getElementById("level3");
const $loadAttrs = document.getElementById("loadAttrs");
const $attrBox = document.getElementById("attrBox");
const $searchAttr = document.getElementById("searchAttr");

// 测试代理按钮
$testProxy.onclick = async () => {
  try {
    const res = await ozon("/ping");
    alert("✅ Ozon Proxy 正常运行: " + JSON.stringify(res));
  } catch {
    alert("❌ 无法连接 Ozon Proxy，请检查环境变量或服务器代理。");
  }
};

// 获取类目树
$loadTree.onclick = async () => {
  try {
    $status.textContent = "正在获取类目树...";
    const res = await ozon("/v1/description-category/tree", { language: LANG });
    treeData = res.result || [];
    localStorage.setItem("ozon_tree", JSON.stringify(treeData));
    renderLevel1();
    $status.textContent = "✅ 类目树加载成功，共 " + treeData.length + " 个一级类目";
  } catch (e) {
    console.error(e);
    $status.textContent = "❌ 获取类目树失败";
  }
};

// 渲染第一级
function renderLevel1() {
  $level1.innerHTML = `<option value="">选择一级类目</option>` + treeData.map(c => `<option value="${c.description_category_id}">${c.category_name}</option>`).join('');
  $level2.innerHTML = "";
  $level3.innerHTML = "";
  $attrBox.innerHTML = "";
}
$level1.onchange = () => {
  currentC1 = Number($level1.value);
  const c1 = treeData.find(c => c.description_category_id == currentC1);
  const children = c1?.children || [];
  $level2.innerHTML = `<option value="">选择二级类目</option>` + children.map(c => `<option value="${c.description_category_id}">${c.category_name}</option>`).join('');
  $level3.innerHTML = "";
  $attrBox.innerHTML = "";
};
$level2.onchange = () => {
  currentC2 = Number($level2.value);
  const c1 = treeData.find(c => c.description_category_id == currentC1);
  const c2 = c1?.children.find(c => c.description_category_id == currentC2);
  const children = c2?.children || [];
  $level3.innerHTML = `<option value="">选择三级类目</option>` + children.map(c => `<option value="${c.type_id}">${c.type_name}</option>`).join('');
  $attrBox.innerHTML = "";
};
$level3.onchange = () => {
  currentType = Number($level3.value);
};

// 获取属性
$loadAttrs.onclick = async () => {
  if (!currentC2 || !currentType) return alert("请先选择完整的三级类目！");
  try {
    $status.textContent = "正在获取属性...";
    const res = await ozon("/v1/description-category/attribute", {
      description_category_id: currentC2,
      type_id: currentType,
      language: LANG
    });
    ATTR_ALL = res.result || [];
    renderAttrs();
    $status.textContent = "✅ 属性加载完成：" + ATTR_ALL.length + " 个";
  } catch (e) {
    console.error(e);
    $status.textContent = "❌ 获取属性失败：" + e.message;
  }
};

// 渲染属性
function renderAttrs() {
  const onlyReq = $onlyRequired.checked;
  const kw = ($searchAttr.value || "").toLowerCase();
  const list = ATTR_ALL.filter(a => (!onlyReq || a.is_required) && (!kw || a.name.toLowerCase().includes(kw)));

  $attrBox.innerHTML = list.map(a => {
    let inputEl = "";
    switch (a.type.toLowerCase()) {
      case "boolean":
        inputEl = `<label class="inline-flex items-center"><input type="checkbox" id="attr-${a.id}" class="form-checkbox"><span class="ml-2 text-xs text-gray-600">是/否</span></label>`;
        break;
      case "integer":
      case "decimal":
        inputEl = `<input type="number" id="attr-${a.id}" placeholder="请输入数字" class="w-full border rounded px-2 py-1 text-sm mt-1">`;
        break;
      default:
        inputEl = `<input type="text" id="attr-${a.id}" placeholder="请输入" class="w-full border rounded px-2 py-1 text-sm mt-1">`;
    }

    const dictBtn = a.dictionary_id > 0
      ? `<button data-dict="${a.id}" data-dictid="${a.dictionary_id}" class="mt-2 text-xs px-2 py-1 bg-indigo-600 text-white rounded hover:bg-indigo-700">加载字典</button><div id="dict-${a.id}" class="mt-2 text-xs text-gray-600"></div>`
      : "";

    return `
    <div class="border rounded p-3 bg-white hover:bg-gray-50 transition">
      <div class="flex justify-between items-center">
        <div class="font-medium">
          ${a.name} ${a.is_required ? '<span class="text-red-600 text-xs">(必填)</span>' : '<span class="text-green-600 text-xs">(选填)</span>'}
        </div>
        <div class="text-xs text-gray-500">类型: ${a.type} · ID: ${a.id}</div>
      </div>
      <div class="text-xs text-gray-500 mt-1">${a.description || ""}</div>
      ${inputEl}
      ${dictBtn}
    </div>`;
  }).join("");

  document.querySelectorAll("[data-dict]").forEach(btn => {
    btn.onclick = async () => {
      const attrId = btn.dataset.dict;
      const box = document.getElementById("dict-" + attrId);
      const input = document.getElementById("attr-" + attrId);
      box.innerHTML = "加载中...";
      try {
        const res = await ozon("/v1/description-category/attribute/values", {
          attribute_id: Number(attrId),
          description_category_id: currentC2,
          type_id: currentType,
          limit: 2000,
          language: LANG
        });
        const vals = res.result || [];
        if (!vals.length) return box.innerHTML = "暂无字典";
        const select = document.createElement("select");
        select.className = "border rounded px-2 py-1 text-xs";
        select.innerHTML = `<option value="">请选择</option>` + vals.map(v => `<option value="${v.value}">${v.value}</option>`).join("");
        select.onchange = () => input.value = select.value;
        box.innerHTML = "";
        box.appendChild(select);
      } catch (e) {
        box.innerHTML = "❌ 加载失败：" + e.message;
      }
    };
  });
}

// 搜索属性监听
$searchAttr.oninput = renderAttrs;
$onlyRequired.onchange = renderAttrs;
</script>
</body>
</html>
