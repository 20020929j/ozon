<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Ozon 类目属性助手 v4.0_stable + 批量上传模块</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">
  <div class="max-w-7xl mx-auto p-6 space-y-6">
    <h1 class="text-2xl font-bold">Ozon 类目属性助手 v4.0_stable</h1>

    <!-- 顶部操作栏（保留） -->
    <div class="flex flex-wrap gap-3 items-center">
      <button id="btnPing" class="px-4 py-2 rounded bg-gray-700 text-white hover:bg-gray-800">
        🔍 验证 API 连接
      </button>
      <span id="pingStatus" class="text-sm text-gray-600"></span>

      <label class="ml-6 text-sm">语言：</label>
      <select id="lang" class="border rounded px-3 py-2">
        <option value="ZH_HANS">中文</option>
        <option value="RU">俄语</option>
        <option value="EN">英语</option>
      </select>

      <button id="btnLoadTree" class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">
        获取类目树
      </button>

      <button id="btnForceReload" class="px-4 py-2 rounded bg-orange-600 text-white hover:bg-orange-700">
        清除缓存
      </button>

      <label class="inline-flex items-center ml-4">
        <input id="onlyRequired" type="checkbox" class="mr-2" /> 仅显示必填
      </label>
    </div>

    <!-- 类目下拉（保留） -->
    <div class="grid md:grid-cols-3 gap-3">
      <select id="c1" class="w-full border rounded px-3 py-2"><option>请获取类目树...</option></select>
      <select id="c2" class="w-full border rounded px-3 py-2"></select>
      <select id="c3" class="w-full border rounded px-3 py-2"></select>
    </div>

    <div id="tips" class="text-sm text-gray-500">请选择二级类目和三级类型后自动获取属性</div>

    <!-- 属性面板（保留，自动字典+搜索输入） -->
    <div id="attrPanel" class="bg-white rounded-2xl shadow p-4">
      <div id="attrLoading" class="text-sm text-gray-600">尚未加载属性...</div>
      <div id="attrList" class="hidden">
        <div class="flex items-center justify-between mb-3">
          <div class="text-sm text-gray-500"><span id="counter"></span></div>
          <input id="attrSearch" type="text" class="border rounded px-3 py-1 text-sm" placeholder="搜索属性..." />
        </div>
        <div id="attrCards" class="grid gap-3"></div>
      </div>
    </div>

    <!-- 🆕 批量上传模块：不影响已有功能 -->
    <div class="bg-white rounded-2xl shadow p-4">
      <h2 class="font-semibold text-lg mb-2">📦 批量创建/更新商品（/v3/product/import）</h2>
      <p class="text-xs text-gray-500 mb-4">
        说明：图片需为公网 URL。下方支持<strong>本地选择</strong>后自动上传到 <code>sm.ms</code> 并回填链接。当前页面已填写的“类目属性值”会<span class="font-semibold">应用到每一行商品</span>。
      </p>

      <div class="flex items-center gap-3 mb-3">
        <button id="btnAddRow" class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700">+ 新增一行</button>
        <button id="btnClearRows" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">清空所有行</button>
        <button id="btnUploadBatch" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">🚀 批量上传</button>
        <span id="batchStatus" class="text-sm text-gray-600"></span>
      </div>

      <!-- 批量表格 -->
      <div class="overflow-x-auto">
        <table class="w-full text-sm border border-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="border px-2 py-2">#</th>
              <th class="border px-2 py-2">Offer ID</th>
              <th class="border px-2 py-2">标题</th>
              <th class="border px-2 py-2">价格</th>
              <th class="border px-2 py-2">币种</th>
              <th class="border px-2 py-2">条码</th>
              <th class="border px-2 py-2">长×宽×高(cm)</th>
              <th class="border px-2 py-2">重量(kg)</th>
              <th class="border px-2 py-2">主图</th>
              <th class="border px-2 py-2">更多图片(每行一条)</th>
              <th class="border px-2 py-2">本地图片上传</th>
              <th class="border px-2 py-2">操作</th>
            </tr>
          </thead>
          <tbody id="batchTbody"></tbody>
        </table>
      </div>

      <div class="mt-3">
        <label class="block text-sm mb-1">商品描述（所有行共用，可含 HTML）：</label>
        <textarea id="commonDesc" class="border rounded px-3 py-2 w-full h-28" placeholder="可选：若不同商品描述差异较大，建议后续再加‘每行单独描述’字段。"></textarea>
      </div>

      <pre id="batchResult" class="bg-gray-100 text-xs p-3 rounded mt-4 overflow-auto max-h-80"></pre>
    </div>
  </div>

  <script>
    // ========== 代理调用（保留） ==========
    const ozon = async (endpoint, body = null) => {
      const opts = body
        ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
        : { method: 'GET' };
      const res = await fetch('/api/ozon-proxy?endpoint=' + encodeURIComponent(endpoint), opts);
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.error || JSON.stringify(data));
      return data.data || data;
    };

    // ========== 稳定基线的状态（保留） ==========
    let TREE = [], C1 = [], C2 = [], C3 = [];
    let currentC2 = 0, currentType = 0;
    let ATTR_ALL = [];
    let LANG = 'ZH_HANS';

    const $btnPing = document.getElementById('btnPing');
    const $pingStatus = document.getElementById('pingStatus');
    const $btnLoadTree = document.getElementById('btnLoadTree');
    const $btnForceReload = document.getElementById('btnForceReload');
    const $c1 = document.getElementById('c1'), $c2 = document.getElementById('c2'), $c3 = document.getElementById('c3');
    const $tips = document.getElementById('tips');
    const $attrLoading = document.getElementById('attrLoading');
    const $attrList = document.getElementById('attrList');
    const $attrCards = document.getElementById('attrCards');
    const $counter = document.getElementById('counter');
    const $attrSearch = document.getElementById('attrSearch');
    const $onlyRequired = document.getElementById('onlyRequired');
    const $lang = document.getElementById('lang');

    $lang.addEventListener('change', () => (LANG = $lang.value));

    // ========== API 连接（保留） ==========
    $btnPing.onclick = async () => {
      $pingStatus.textContent = '检测中...';
      try {
        const proxyOk = await fetch('/api/ozon-proxy').then(r => r.json());
        if (!proxyOk.ok) throw new Error('代理异常');
        const apiOk = await ozon('/v1/description-category/tree', { language: 'RU' });
        $pingStatus.textContent = `✅ 连接成功 (${apiOk.result.length} 类)`;
      } catch (e) {
        $pingStatus.textContent = '❌ ' + e.message;
      }
    };

    // ========== 类目树（保留） ==========
    const fillSelect = (sel, arr, ph) => {
      sel.innerHTML = `<option value="">${ph}</option>` + arr.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
    };

    $btnLoadTree.onclick = async () => {
      $tips.textContent = '正在加载类目...';
      const cacheKey = 'OZON_TREE_' + LANG;
      const cached = localStorage.getItem(cacheKey);
      if (cached) {
        TREE = JSON.parse(cached);
        fillSelect($c1, TREE.map(c => ({ id: c.description_category_id, name: c.category_name, children: c.children })), '一级类目');
        $tips.textContent = '✅ 已从缓存加载';
        return;
      }
      try {
        const r = await ozon('/v1/description-category/tree', { language: LANG });
        TREE = r.result || [];
        localStorage.setItem(cacheKey, JSON.stringify(TREE));
        fillSelect($c1, TREE.map(c => ({ id: c.description_category_id, name: c.category_name, children: c.children })), '一级类目');
        $tips.textContent = '✅ 类目树加载成功';
      } catch (e) {
        $tips.textContent = '❌ 加载失败：' + e.message;
      }
    };

    $btnForceReload.onclick = () => {
      localStorage.removeItem('OZON_TREE_' + LANG);
      alert('缓存已清除');
    };

    $c1.onchange = () => {
      const n = TREE.find(x => x.description_category_id == $c1.value);
      C2 = n?.children?.map(c => ({ id: c.description_category_id, name: c.category_name, children: c.children })) || [];
      fillSelect($c2, C2, '二级类目');
      fillSelect($c3, [], '三级类型');
    };
    $c2.onchange = () => {
      const n = C2.find(x => x.id == $c2.value);
      C3 = n?.children?.map(t => ({ id: t.type_id, name: t.type_name })) || [];
      fillSelect($c3, C3, '三级类型');
      currentC2 = Number($c2.value);
    };
    $c3.onchange = () => {
      currentType = Number($c3.value);
      if (currentC2 && currentType) loadAttrs();
    };

    // ========== 属性（保留：必填优先、自动字典+搜索输入） ==========
    async function loadAttrs() {
      try {
        $attrLoading.textContent = '获取属性中...';
        const r = await ozon('/v1/description-category/attribute', { description_category_id: currentC2, type_id: currentType, language: LANG });
        ATTR_ALL = r.result || [];
        ATTR_ALL.sort((a, b) => Number(b.is_required) - Number(a.is_required));
        await autoLoadDictionaries();
        renderAttrs();
        $attrLoading.classList.add('hidden');
        $attrList.classList.remove('hidden');
        $tips.textContent = `✅ 已加载 ${ATTR_ALL.length} 条属性`;
      } catch (e) {
        $attrLoading.textContent = '❌ ' + e.message;
      }
    }

    async function autoLoadDictionaries() {
      for (const a of ATTR_ALL) {
        if (a.dictionary_id > 0) {
          try {
            const dict = await ozon('/v1/description-category/attribute/values', {
              attribute_id: a.id, description_category_id: currentC2, type_id: currentType, limit: 2000, language: LANG
            });
            a._dict = dict.result || [];
          } catch { a._dict = []; }
        }
      }
    }

    const renderAttrs = () => {
      const onlyReq = $onlyRequired.checked;
      const kw = ($attrSearch.value || '').toLowerCase();
      const list = ATTR_ALL.filter(a => (!onlyReq || a.is_required) && (!kw || a.name.toLowerCase().includes(kw)));
      document.getElementById('counter').textContent = `显示 ${list.length} / ${ATTR_ALL.length}`;
      const $wrap = document.getElementById('attrCards');
      $wrap.innerHTML = '';
      for (const a of list) {
        const div = document.createElement('div');
        div.className = 'border rounded p-3 ' + (a.is_required ? 'border-red-300' : 'border-gray-200');
        div.innerHTML = `
          <div class="flex justify-between">
            <div class="font-medium">${a.name} ${a.is_required ? '<span class="text-red-600">(必填)</span>' : '<span class="text-green-600">(选填)</span>'}</div>
            <div class="text-xs text-gray-500">类型: ${a.type} · ID: ${a.id}</div>
          </div>
          <div class="text-xs text-gray-500 mt-1">${a.description || ''}</div>
          <div class="mt-2">
            ${a._dict && a._dict.length
              ? `<input list="d-${a.id}" id="in-${a.id}" class="w-full border rounded px-2 py-1 text-sm" placeholder="输入或选择..." />
                 <datalist id="d-${a.id}">${a._dict.map(v => `<option value="${v.value}"></option>`).join('')}</datalist>`
              : `<input id="in-${a.id}" class="w-full border rounded px-2 py-1 text-sm" placeholder="请输入..." />`}
          </div>
        `;
        $wrap.appendChild(div);
      }
    };

    $onlyRequired.onchange = renderAttrs;
    $attrSearch.oninput = renderAttrs;

    // ========== 批量上传模块 ==========
    const $tbody = document.getElementById('batchTbody');
    const $batchStatus = document.getElementById('batchStatus');
    const $batchResult = document.getElementById('batchResult');
    const $btnAddRow = document.getElementById('btnAddRow');
    const $btnClearRows = document.getElementById('btnClearRows');
    const $btnUploadBatch = document.getElementById('btnUploadBatch');
    const $commonDesc = document.getElementById('commonDesc');

    let rowSeq = 0;

    const newRowHtml = (idx) => `
      <tr data-row="${idx}">
        <td class="border px-2 py-1 text-center">${idx}</td>
        <td class="border px-2 py-1"><input class="w-40 border rounded px-2 py-1" placeholder="offer_id"></td>
        <td class="border px-2 py-1"><input class="w-48 border rounded px-2 py-1" placeholder="标题"></td>
        <td class="border px-2 py-1"><input type="number" class="w-24 border rounded px-2 py-1" placeholder="价格"></td>
        <td class="border px-2 py-1">
          <select class="w-20 border rounded px-2 py-1">
            <option>RUB</option><option>CNY</option><option>USD</option>
          </select>
        </td>
        <td class="border px-2 py-1"><input class="w-28 border rounded px-2 py-1" placeholder="条码"></td>
        <td class="border px-2 py-1">
          <div class="flex gap-1">
            <input type="number" class="w-16 border rounded px-1 py-1" placeholder="长">
            <input type="number" class="w-16 border rounded px-1 py-1" placeholder="宽">
            <input type="number" class="w-16 border rounded px-1 py-1" placeholder="高">
          </div>
        </td>
        <td class="border px-2 py-1">
          <input type="number" class="w-20 border rounded px-2 py-1" placeholder="重量">
        </td>
        <td class="border px-2 py-1">
          <input class="w-48 border rounded px-2 py-1" placeholder="主图URL">
        </td>
        <td class="border px-2 py-1">
          <textarea class="w-56 h-16 border rounded px-2 py-1" placeholder="更多图片：每行一条URL"></textarea>
        </td>
        <td class="border px-2 py-1">
          <input type="file" class="file-input" accept="image/png,image/jpeg" multiple>
          <button class="mt-1 px-2 py-1 text-xs bg-indigo-600 text-white rounded upload-smms">上传到sm.ms</button>
          <div class="text-[11px] text-gray-500 mt-1">上传成功会自动填入主图/图片区</div>
        </td>
        <td class="border px-2 py-1">
          <button class="px-2 py-1 text-xs bg-red-500 text-white rounded del-row">删除</button>
        </td>
      </tr>
    `;

    const addRow = () => {
      rowSeq += 1;
      const tr = document.createElement('tr');
      tr.innerHTML = newRowHtml(rowSeq);
      // newRowHtml 已含 <tr> 包一层，这里统一用 innerHTML 输出后取 child
      $tbody.appendChild(tr.firstElementChild || tr);
    };

    $btnAddRow.onclick = addRow;
    $btnClearRows.onclick = () => { $tbody.innerHTML = ''; rowSeq = 0; };

    // 初始添加一行
    addRow();

    // sm.ms 上传
    async function uploadToSmMs(files) {
      const urls = [];
      for (const f of files) {
        const fd = new FormData();
        fd.append('smfile', f);
        // 匿名上传（注意图床限制）
        const res = await fetch('https://sm.ms/api/v2/upload', { method: 'POST', body: fd });
        const json = await res.json();
        if (json.success && json.data && json.data.url) {
          urls.push(json.data.url);
        } else if (json.code === 'image_repeated' && json.images) {
          urls.push(json.images); // 已上传过的图片会返回直链
        }
      }
      return urls;
    }

    // 行内事件代理：删除、sm.ms上传
    $tbody.addEventListener('click', async (e) => {
      const btn = e.target;
      const row = btn.closest('tr[data-row]');
      if (!row) return;

      // 删除行
      if (btn.classList.contains('del-row')) {
        row.remove();
        return;
      }

      // 上传到 sm.ms
      if (btn.classList.contains('upload-smms')) {
        const fileInput = row.querySelector('.file-input');
        const primaryInput = row.children[8].querySelector('input');
        const moreTextarea = row.children[9].querySelector('textarea');

        const files = fileInput.files;
        if (!files || !files.length) {
          alert('请先选择本地图片文件（JPG/PNG）');
          return;
        }
        btn.disabled = true;
        btn.textContent = '上传中...';
        try {
          const urls = await uploadToSmMs(files);
          if (!urls.length) throw new Error('上传失败');
          // 第一张作为主图，其余放到更多图片
          primaryInput.value = urls[0];
          const exist = (moreTextarea.value || '').trim();
          const extra = urls.slice(1).join('\n');
          moreTextarea.value = [exist, extra].filter(Boolean).join(exist ? '\n' : '');
          btn.textContent = '上传完成';
        } catch (err) {
          btn.textContent = '上传到sm.ms';
          alert('上传失败：' + (err.message || err));
        } finally {
          btn.disabled = false;
        }
      }
    });

    // 组装 attributes：从属性面板的输入框读取
    function collectAttributesFromUI() {
      const attrs = [];
      for (const a of ATTR_ALL) {
        const el = document.getElementById('in-' + a.id);
        if (!el) continue;
        const val = (el.value || '').trim();
        if (!val) continue;
        attrs.push({ attribute_id: a.id, values: [{ value: val }] });
      }
      return attrs;
    }

    // 批量上传
    $btnUploadBatch.onclick = async () => {
      try {
        if (!currentC2 || !currentType) {
          alert('请先选择类目（到第三级类型）并等待属性加载完成。');
          return;
        }
        const rows = Array.from($tbody.querySelectorAll('tr[data-row]'));
        if (!rows.length) {
          alert('请先新增至少一行商品。');
          return;
        }
        $batchStatus.textContent = '⏳ 上传中...';
        $batchResult.textContent = '';

        // 公共属性与描述
        const attrsCommon = collectAttributesFromUI();
        const commonDesc = $commonDesc.value || '';

        // 逐行采集
        const items = rows.map((row) => {
          const offer_id = row.children[1].querySelector('input').value.trim();
          const name = row.children[2].querySelector('input').value.trim();
          const price = row.children[3].querySelector('input').value.trim();
          const currency = row.children[4].querySelector('select').value;
          const barcode = row.children[5].querySelector('input').value.trim();
          const depth = Number(row.children[6].querySelectorAll('input')[0].value || 0);
          const width = Number(row.children[6].querySelectorAll('input')[1].value || 0);
          const height = Number(row.children[6].querySelectorAll('input')[2].value || 0);
          const weight = Number(row.children[7].querySelector('input').value || 0);
          const primary_image = row.children[8].querySelector('input').value.trim();
          const moreImages = (row.children[9].querySelector('textarea').value || '')
            .split(/\n/)
            .map(s => s.trim())
            .filter(Boolean);
          const images = [
            ...(primary_image ? [primary_image] : []),
            ...moreImages
          ].slice(0, 30); // 总数最多30

          return {
            offer_id,
            name,
            category_id: currentC2,
            description: commonDesc,
            price: price,
            currency_code: currency,
            barcode: barcode || undefined,
            // 体积重量（官方要求必传，且不为0）
            depth, width, height, dimension_unit: 'cm',
            weight, weight_unit: 'kg',
            // 图片
            primary_image: primary_image || undefined,
            images: images.map(u => ({ file_name: u })),
            // 属性（应用当前属性面板填写的值）
            attributes: attrsCommon
          };
        });

        // 简单校验：offer_id / name / price / images / 体积重量
        const bad = items.find(it =>
          !it.offer_id || !it.name || !it.price ||
          !it.depth || !it.width || !it.height || !it.weight
        );
        if (bad) {
          alert('请检查：每行的 offer_id / 标题 / 价格 / 长宽高 / 重量 均需填写且非 0');
          $batchStatus.textContent = '';
          return;
        }

        const payload = { items };
        const resp = await ozon('/v3/product/import', payload);
        $batchResult.textContent = JSON.stringify(resp, null, 2);
        $batchStatus.textContent = '✅ 已提交，返回结果见下方';
      } catch (e) {
        $batchStatus.textContent = '❌ 失败：' + e.message;
      }
    };
  </script>
</body>
</html>
