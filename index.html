<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Ozon 类目属性助手（回滚稳定版 · 使用 /api/ozon-proxy）</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f7fafc;color:#1a202c;margin:0}
  .wrap{max-width:1100px;margin:20px auto;padding:0 16px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .btn{background:#2563eb;color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
  .btn:hover{background:#1d4ed8}
  .btn-secondary{background:#10b981}
  .btn-secondary:hover{background:#059669}
  .btn-gray{background:#4b5563}
  .btn-gray:hover{background:#374151}
  select,input,textarea{border:1px solid #cbd5e1;border-radius:8px;padding:8px}
  select,input{height:36px}
  .select{min-width:220px}
  .badge{font-size:12px;padding:1px 6px;border-radius:999px}
  .danger{background:#fee2e2;color:#991b1b}
  .ok{background:#dcfce7;color:#166534}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px}
  .muted{color:#6b7280;font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛒 Ozon 类目属性助手（回滚稳定版 · 使用 /api/ozon-proxy）</h1>

  <!-- 操作栏 -->
  <div class="row">
    <select id="lang" class="select">
      <option value="ZH_HANS">ZH_HANS（中文）</option>
      <option value="RU">RU（俄语）</option>
      <option value="EN">EN（英语）</option>
    </select>
    <button id="btnPing" class="btn">测试代理</button>
    <button id="btnTree" class="btn btn-secondary">获取类目树</button>
    <label class="muted"><input type="checkbox" id="onlyReq" /> 仅显示必填</label>
  </div>

  <!-- 类目选择 -->
  <div class="row">
    <select id="lvl1" class="select"><option>加载中...</option></select>
    <select id="lvl2" class="select"></select>
    <select id="lvl3" class="select"></select>
    <button id="btnAttrs" class="btn btn-gray">刷新属性</button>
  </div>

  <!-- 状态/搜索 -->
  <div id="status" class="muted">尚未加载。</div>
  <div class="row">
    <input id="kw" placeholder="搜索属性..." class="select" style="flex:1" />
  </div>

  <!-- 属性列表 -->
  <div id="attrBox" class="grid"></div>
</div>

<script>
// ============ 关键：回滚到 /api/ozon-proxy 统一代理 ============
// GET  /api/ozon-proxy              -> 健康检查
// POST /api/ozon-proxy?endpoint=/v1/...  -> 其他 Ozon API
async function proxy(endpoint, body = {}) {
  const url = `/api/ozon-proxy?endpoint=${encodeURIComponent(endpoint)}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(()=>({}));
  return { ok: res.ok, status: res.status, data };
}

async function ping() {
  const res = await fetch('/api/ozon-proxy');
  if(!res.ok) throw new Error('Ping failed');
  return res.json();
}

// ============ DOM refs ============
const $lang = document.getElementById('lang');
const $btnPing = document.getElementById('btnPing');
const $btnTree = document.getElementById('btnTree');
const $onlyReq = document.getElementById('onlyReq');
const $lvl1 = document.getElementById('lvl1');
const $lvl2 = document.getElementById('lvl2');
const $lvl3 = document.getElementById('lvl3');
const $btnAttrs = document.getElementById('btnAttrs');
const $attrBox = document.getElementById('attrBox');
const $status = document.getElementById('status');
const $kw = document.getElementById('kw');

// ============ 全局状态 ============
let LANG = 'ZH_HANS';
let TREE = [];         // 类目树
let ATTRS = [];        // 全部属性
let currentL1 = 0, currentL2 = 0, currentType = 0;

// ============ 事件 ============
$lang.onchange = () => { LANG = $lang.value; };
$btnPing.onclick = async () => {
  try {
    const r = await ping();
    alert('✅ Ozon Proxy OK: ' + JSON.stringify(r));
  } catch(e) {
    alert('❌ 无法连接 Ozon Proxy，请检查环境变量或服务器代理。');
  }
};

$btnTree.onclick = async () => {
  try {
    $status.textContent = '正在获取类目树...';
    const { ok, data } = await proxy('/v1/description-category/tree', { language: LANG });
    if(!ok) throw new Error(JSON.stringify(data));
    TREE = (data && data.result) || [];
    localStorage.setItem('ozon_tree', JSON.stringify(TREE));
    renderLevel1();
    $status.textContent = `✅ 类目树加载成功：${TREE.length} 个一级类目`;
  } catch(e) {
    console.error(e);
    $status.textContent = '❌ 获取类目树失败：' + (e.message||'');
  }
};

$lvl1.onchange = () => {
  currentL1 = Number($lvl1.value);
  const l1 = TREE.find(i => i.description_category_id == currentL1);
  const l2s = l1?.children || [];
  $lvl2.innerHTML = `<option value="">选择二级类目</option>` + l2s.map(i => `<option value="${i.description_category_id}">${i.category_name}</option>`).join('');
  $lvl3.innerHTML = '';
  currentL2 = 0; currentType = 0; ATTRS = []; $attrBox.innerHTML='';
};
$lvl2.onchange = () => {
  currentL2 = Number($lvl2.value);
  const l1 = TREE.find(i => i.description_category_id == currentL1);
  const l2 = l1?.children.find(i => i.description_category_id == currentL2);
  const l3s = l2?.children || [];
  $lvl3.innerHTML = `<option value="">选择三级类目</option>` + l3s.map(i => `<option value="${i.type_id}">${i.type_name}</option>`).join('');
  currentType = 0; ATTRS = []; $attrBox.innerHTML='';
};
$lvl3.onchange = () => {
  currentType = Number($lvl3.value);
};

$btnAttrs.onclick = async () => {
  if(!currentL2 || !currentType) return alert('请先选择完整的三级类目！');
  try {
    $status.textContent = '正在获取属性...';
    const { ok, data } = await proxy('/v1/description-category/attribute', {
      description_category_id: currentL2,
      type_id: currentType,
      language: LANG
    });
    if(!ok) throw new Error(JSON.stringify(data));
    ATTRS = (data && data.result) || [];
    renderAttrs();
    $status.textContent = `✅ 已加载属性：${ATTRS.length} 个`;
  } catch(e) {
    console.error(e);
    $status.textContent = '❌ 获取属性失败：' + (e.message||'');
  }
};

$onlyReq.onchange = renderAttrs;
$kw.oninput = renderAttrs;

// ============ 渲染 ============
function renderLevel1(){
  $lvl1.innerHTML = `<option value="">选择一级类目</option>` + TREE.map(i => `<option value="${i.description_category_id}">${i.category_name}</option>`).join('');
  $lvl2.innerHTML = ''; $lvl3.innerHTML = ''; $attrBox.innerHTML = '';
  currentL1=0; currentL2=0; currentType=0; ATTRS=[];
}

function renderAttrs(){
  const only = $onlyReq.checked;
  const k = ($kw.value||'').trim().toLowerCase();
  const list = ATTRS.filter(a => (!only || a.is_required) && (!k || (a.name||'').toLowerCase().includes(k)));
  $attrBox.innerHTML = list.map(a => renderAttrCard(a)).join('');
  // 绑定字典按钮
  document.querySelectorAll('[data-dict]').forEach(btn=>{
    btn.addEventListener('click',()=>loadDict(btn));
  });
}

function renderAttrCard(a){
  const req = a.is_required ? `<span class="badge danger">必填</span>` : `<span class="badge ok">选填</span>`;
  const desc = a.description ? `<div class="muted" style="margin-top:4px">${escapeHtml(a.description)}</div>` : '';
  const input = buildInput(a);

  const dictBtn = a.dictionary_id>0
    ? `<button class="btn btn-gray" data-dict="${a.id}" data-dictid="${a.dictionary_id}" style="margin-top:8px">加载字典</button>
       <div id="dict-${a.id}" class="muted" style="margin-top:6px"></div>`
    : '';

  return `
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div><strong>${escapeHtml(a.name||'')}</strong> ${req}</div>
      <div class="muted">类型：${a.type} · ID: ${a.id}</div>
    </div>
    ${desc}
    <div style="margin-top:8px">${input}</div>
    ${dictBtn}
  </div>`;
}

function buildInput(a){
  const id = `attr-${a.id}`;
  const type = (a.type||'string').toLowerCase();
  if(type==='boolean'){
    return `<label class="muted"><input type="checkbox" id="${id}" /> 勾选表示“是”</label>`;
  }
  if(type==='integer' || type==='decimal'){
    return `<input type="number" id="${id}" placeholder="请输入数字" style="width:100%" />`;
  }
  // 默认字符串
  return `<input type="text" id="${id}" placeholder="请输入" style="width:100%" />`;
}

// 加载字典，并生成下拉框 + 写回输入框
async function loadDict(btn){
  const attrId = Number(btn.dataset.dict);
  const box = document.getElementById(`dict-${attrId}`);
  const input = document.getElementById(`attr-${attrId}`);
  box.textContent = '加载中...';
  try{
    const { ok, data } = await proxy('/v1/description-category/attribute/values', {
      attribute_id: attrId,
      description_category_id: currentL2,
      type_id: currentType,
      language: LANG,
      limit: 2000
    });
    if(!ok) throw new Error(JSON.stringify(data));
    const vals = (data && data.result) || [];
    if(!vals.length){ box.textContent = '暂无字典'; return; }
    const sel = document.createElement('select');
    sel.className = 'select'; sel.style.minWidth='260px';
    sel.innerHTML = `<option value="">请选择</option>` + vals.map(v => `<option value="${escapeHtml(v.value||'')}">${escapeHtml(v.value||'')}</option>`).join('');
    sel.onchange = ()=>{ input.value = sel.value; };
    box.textContent = '';
    box.appendChild(sel);
  }catch(e){
    console.error(e);
    box.textContent = '❌ 字典加载失败：' + (e.message||'');
  }
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

// 初次尝试从缓存恢复树（可选）
(function boot(){
  LANG = $lang.value;
  try{
    const cache = localStorage.getItem('ozon_tree');
    if(cache){
      TREE = JSON.parse(cache)||[];
      if(TREE.length) { renderLevel1(); $status.textContent='已从缓存恢复类目树'; }
    }else{
      $lvl1.innerHTML = '<option>请先点击“获取类目树”</option>';
    }
  }catch{}
})();
</script>
</body>
</html>
