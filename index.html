<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ozon 类目属性助手（稳定版 /api/ozon-proxy）</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; background: #f6f8fb; margin: 20px; color: #333; }
    h2 { font-size: 20px; }
    select, input, button { padding: 6px 10px; margin: 4px; }
    button { cursor: pointer; }
    .required { border-left: 4px solid #ff4d4f; padding-left: 8px; margin-top: 10px; background: #fff6f6; }
    .optional { border-left: 4px solid #52c41a; padding-left: 8px; margin-top: 10px; background: #f6ffed; }
    .attr-item { margin-bottom: 8px; }
    .loading { color: #888; }
  </style>
</head>
<body>
  <h2>🛒 Ozon 类目属性助手（支持三级类目选择 + 自动标注必填/选填 + /api/ozon-proxy）</h2>

  <div>
    <label>语言：</label>
    <select id="lang">
      <option value="ZH_HANS">ZH_HANS（中文）</option>
      <option value="RU">RU（俄语）</option>
    </select>
    <button id="testProxy">🔍 测试代理</button>
    <button id="getTree">📂 获取类目树</button>
    <input type="checkbox" id="onlyRequired" />仅显示必填项
  </div>

  <div>
    <select id="cat1"><option>加载中...</option></select>
    <select id="cat2"></select>
    <select id="cat3"></select>
    <button id="getAttributes">刷新属性</button>
  </div>

  <div id="status"></div>
  <div id="attributes"></div>

  <script>
    const proxyUrl = "/api/ozon-proxy";
    const statusDiv = document.getElementById("status");
    const attrDiv = document.getElementById("attributes");
    const langSel = document.getElementById("lang");
    const onlyRequired = document.getElementById("onlyRequired");

    const cat1 = document.getElementById("cat1");
    const cat2 = document.getElementById("cat2");
    const cat3 = document.getElementById("cat3");

    let categoryTree = [];

    // 🔹 测试代理连接是否正常
    document.getElementById("testProxy").onclick = async () => {
      statusDiv.innerHTML = "正在测试代理连接...";
      try {
        const resp = await fetch(proxyUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ test: true }) });
        if (resp.ok) {
          statusDiv.innerHTML = "✅ 代理连接正常，可访问 Ozon API";
        } else {
          statusDiv.innerHTML = "❌ 代理连接失败，请检查环境变量或服务器代理配置";
        }
      } catch (e) {
        statusDiv.innerHTML = "❌ 无法连接到 Ozon Proxy，请检查后端是否部署或环境变量是否缺失";
      }
    };

    // 🔹 获取类目树
    document.getElementById("getTree").onclick = async () => {
      attrDiv.innerHTML = "";
      statusDiv.innerHTML = "正在加载类目树...";
      try {
        const res = await fetch(proxyUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            path: "/v1/description-category/tree",
            body: { language: langSel.value },
          }),
        });
        const data = await res.json();
        if (data.ok && data.data?.result) {
          categoryTree = data.data.result;
          renderCategory(cat1, categoryTree);
          statusDiv.innerHTML = "✅ 类目加载成功";
        } else {
          statusDiv.innerHTML = "❌ 获取类目失败：" + JSON.stringify(data);
        }
      } catch (err) {
        statusDiv.innerHTML = "❌ 网络错误：" + err.message;
      }
    };

    function renderCategory(select, list) {
      select.innerHTML = `<option value="">请选择</option>` + list.map(i => `<option value="${i.description_category_id}">${i.category_name}</option>`).join("");
    }

    cat1.onchange = () => {
      const c1 = categoryTree.find(i => i.description_category_id == cat1.value);
      renderCategory(cat2, c1?.children || []);
      cat3.innerHTML = "";
    };

    cat2.onchange = () => {
      const c1 = categoryTree.find(i => i.description_category_id == cat1.value);
      const c2 = c1?.children?.find(i => i.description_category_id == cat2.value);
      renderCategory(cat3, c2?.children || []);
    };

    // 🔹 获取属性
    document.getElementById("getAttributes").onclick = async () => {
      attrDiv.innerHTML = "正在获取属性...";
      const selected = getSelectedCategory();
      if (!selected) {
        attrDiv.innerHTML = "⚠️ 请先选择完整的三级类目";
        return;
      }
      try {
        const res = await fetch(proxyUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            path: "/v1/description-category/attribute",
            body: {
              description_category_id: selected.cat3_id,
              type_id: selected.type_id,
              language: langSel.value,
            },
          }),
        });
        const data = await res.json();
        if (!data.ok || !data.data?.result) throw new Error("接口返回无效数据");
        renderAttributes(data.data.result);
      } catch (err) {
        attrDiv.innerHTML = "❌ 获取失败：" + err.message;
      }
    };

    function getSelectedCategory() {
      const c1 = categoryTree.find(i => i.description_category_id == cat1.value);
      const c2 = c1?.children?.find(i => i.description_category_id == cat2.value);
      const c3 = c2?.children?.find(i => i.description_category_id == cat3.value);
      if (!c1 || !c2 || !c3) return null;
      return { cat3_id: c2.description_category_id, type_id: c3.type_id };
    }

    // 🔹 渲染属性
    function renderAttributes(list) {
      attrDiv.innerHTML = "";
      const filtered = onlyRequired.checked ? list.filter(a => a.is_required) : list;
      for (const attr of filtered) {
        const box = document.createElement("div");
        box.className = attr.is_required ? "required" : "optional";
        const title = document.createElement("div");
        title.innerHTML = `<b>${attr.name}</b> ${attr.is_required ? "（必填）" : "（选填）"} <small>类型: ${attr.type} | ID: ${attr.id}</small>`;
        box.appendChild(title);

        if (attr.dictionary_id && attr.dictionary_id !== 0) {
          const sel = document.createElement("select");
          sel.innerHTML = `<option>加载字典中...</option>`;
          loadDictionary(sel, attr);
          box.appendChild(sel);
        } else {
          const input = document.createElement("input");
          input.placeholder = "请输入属性值";
          box.appendChild(input);
        }
        attrDiv.appendChild(box);
      }
    }

    // 🔹 加载字典值
    async function loadDictionary(selectEl, attr) {
      try {
        const res = await fetch(proxyUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            path: "/v1/description-category/attribute/values",
            body: {
              attribute_id: attr.id,
              description_category_id: attr.description_category_id,
              type_id: attr.type_id,
              language: langSel.value,
              limit: 100,
              last_value_id: 0
            },
          }),
        });
        const data = await res.json();
        if (data.ok && data.data?.result) {
          selectEl.innerHTML = data.data.result.map(i => `<option value="${i.value}">${i.value}</option>`).join("");
        } else {
          selectEl.innerHTML = "<option>（无字典项）</option>";
        }
      } catch {
        selectEl.innerHTML = "<option>加载失败</option>";
      }
    }
  </script>
</body>
</html>
