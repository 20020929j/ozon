<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Ozon 类目属性助手 v6.2（智能属性优化版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .required-card { background-color: #fff5f5; border-left: 4px solid #f87171; }
    .optional-card { background-color: #f9fafb; }
    .select-search { border: 1px solid #d1d5db; border-radius: 0.25rem; padding: 0.25rem; margin-bottom: 0.25rem; width: 100%; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-7xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">🧩 Ozon 类目属性助手 v6.2（智能属性优化版）</h1>

    <!-- 顶部控制区 -->
    <div class="flex flex-wrap gap-3 mb-4 items-center">
      <button id="btnPing" class="px-4 py-2 rounded bg-gray-700 text-white">🔗 验证 API 连接</button>
      <span id="pingStatus" class="text-sm text-gray-600"></span>
      <label>语言：</label>
      <select id="lang" class="border rounded px-2 py-1">
        <option value="ZH_HANS">ZH_HANS（中文）</option>
        <option value="RU">RU（俄语）</option>
        <option value="EN">EN（英语）</option>
      </select>
      <button id="btnLoadTree" class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">获取类目树</button>
      <button id="btnForceReload" class="px-4 py-2 rounded bg-orange-600 text-white hover:bg-orange-700">清除缓存</button>
    </div>

    <!-- 类目三级 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
      <select id="c1" class="border rounded px-3 py-2"><option>请选择一级类目</option></select>
      <select id="c2" class="border rounded px-3 py-2"><option>请选择二级类目</option></select>
      <select id="c3" class="border rounded px-3 py-2"><option>请选择三级类目</option></select>
    </div>

    <div id="tips" class="text-sm text-gray-600 mb-3">请选择类目以加载属性</div>

    <!-- 属性区域 -->
    <div id="attrPanel" class="bg-white rounded-lg shadow p-4 mb-8">
      <div id="attrLoading">尚未加载属性...</div>
      <div id="attrList" class="hidden">
        <div class="flex justify-between mb-3 items-center">
          <div class="text-sm text-gray-500"><span id="counter"></span></div>
          <input id="attrSearch" type="text" class="border rounded px-2 py-1 text-sm" placeholder="搜索属性..."/>
        </div>
        <div id="attrCards" class="grid gap-3"></div>
      </div>
    </div>
  </div>

  <script>
    const ozon = async (endpoint, body = null) => {
      const opts = body ? { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : { method: "GET" };
      const res = await fetch("/api/ozon-proxy?endpoint=" + encodeURIComponent(endpoint), opts);
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.error || JSON.stringify(data));
      return data.data || data;
    };

    let LANG = "ZH_HANS", TREE = [], C2 = [], C3 = [], ATTRS = [];

    const $c1 = document.getElementById("c1"), $c2 = document.getElementById("c2"), $c3 = document.getElementById("c3");
    const $attrLoading = document.getElementById("attrLoading");
    const $attrList = document.getElementById("attrList");
    const $attrCards = document.getElementById("attrCards");
    const $counter = document.getElementById("counter");
    const $tips = document.getElementById("tips");

    document.getElementById("btnLoadTree").onclick = async () => {
      $tips.textContent = "加载类目树中...";
      try {
        const resp = await ozon("/v1/description-category/tree", { language: LANG });
        TREE = resp.result;
        fillSelect($c1, TREE.map(c => ({ id: c.description_category_id, name: c.category_name })), "请选择一级类目");
        $tips.textContent = "✅ 类目树加载成功";
      } catch (e) {
        $tips.textContent = "❌ 加载失败：" + e.message;
      }
    };

    const fillSelect = (sel, arr, ph) => {
      sel.innerHTML = `<option value="">${ph}</option>` + arr.map(a => `<option value="${a.id}">${a.name}</option>`).join("");
    };

    $c1.onchange = () => {
      const found = TREE.find(x => x.description_category_id == $c1.value);
      C2 = found?.children || [];
      fillSelect($c2, C2.map(c => ({ id: c.description_category_id, name: c.category_name })), "请选择二级类目");
    };

    $c2.onchange = () => {
      const found = C2.find(x => x.description_category_id == $c2.value);
      C3 = found?.children || [];
      fillSelect($c3, C3.map(t => ({ id: t.type_id, name: t.type_name })), "请选择三级类目");
    };

    $c3.onchange = async () => {
      if (!$c2.value || !$c3.value) return;
      $attrLoading.textContent = "获取属性中...";
      try {
        const resp = await ozon("/v1/description-category/attribute", {
          description_category_id: Number($c2.value),
          type_id: Number($c3.value),
          language: LANG
        });
        ATTRS = resp.result || [];
        ATTRS.sort((a,b) => b.is_required - a.is_required); // ✅ 必填项优先
        renderAttrs();
      } catch (e) {
        $attrLoading.textContent = "❌ 加载失败：" + e.message;
      }
    };

    async function renderAttrs() {
  $attrLoading.classList.add("hidden");
  $attrList.classList.remove("hidden");
  $counter.textContent = `共 ${ATTRS.length} 个属性`;
  $attrCards.innerHTML = "";

  for (const a of ATTRS) {
    const card = document.createElement("div");
    card.className = `border rounded p-3 mb-2 ${a.is_required ? "required-card" : "optional-card"}`;
    card.innerHTML = `
      <div class="font-medium">${a.name} ${a.is_required ? '<span class="text-red-600">(必填)</span>' : ''}</div>
      <div class="text-xs text-gray-500 mb-1">${a.description || ''}</div>
      <div id="input-${a.id}">加载中...</div>
    `;
    $attrCards.appendChild(card);

    // 如果存在字典
    if (a.dictionary_id > 0) {
      try {
        const vals = (await ozon("/v1/description-category/attribute/values", {
          attribute_id: Number(a.id),
          description_category_id: Number($c2.value),
          type_id: Number($c3.value),
          limit: 2000,
          language: LANG
        })).result || [];

        const container = document.getElementById(`input-${a.id}`);

        // 一体化输入框 + 下拉选项
        const wrapper = document.createElement("div");
        wrapper.className = "relative";

        const input = document.createElement("input");
        input.id = `attr-${a.id}`;
        input.className = "border rounded px-2 py-1 text-sm w-full";
        input.placeholder = "输入或选择...";
        wrapper.appendChild(input);

        const dropdown = document.createElement("div");
        dropdown.className = "absolute z-10 bg-white border rounded mt-1 shadow-md w-full max-h-48 overflow-auto hidden";
        dropdown.style.fontSize = "13px";
        wrapper.appendChild(dropdown);

        container.innerHTML = "";
        container.appendChild(wrapper);

        // 渲染下拉选项
        function renderOptions(filter = "") {
          dropdown.innerHTML = "";
          const filtered = vals.filter(v => v.value.toLowerCase().includes(filter.toLowerCase()));
          if (filtered.length === 0) {
            dropdown.innerHTML = `<div class="p-2 text-gray-400">无匹配项</div>`;
          } else {
            filtered.forEach(v => {
              const opt = document.createElement("div");
              opt.className = "p-2 hover:bg-blue-100 cursor-pointer";
              opt.textContent = v.value;
              opt.addEventListener("click", () => {
                input.value = v.value;
                dropdown.classList.add("hidden");
              });
              dropdown.appendChild(opt);
            });
          }
        }

        // 聚焦时展开
        input.addEventListener("focus", () => {
          renderOptions();
          dropdown.classList.remove("hidden");
        });

        // 输入时筛选
        input.addEventListener("input", () => {
          renderOptions(input.value);
          dropdown.classList.remove("hidden");
        });

        // 失焦时隐藏（稍延迟防止点击失效）
        input.addEventListener("blur", () => {
          setTimeout(() => dropdown.classList.add("hidden"), 200);
        });

      } catch (e) {
        document.getElementById(`input-${a.id}`).innerHTML =
          `<input id="attr-${a.id}" class="border rounded px-2 py-1 text-sm w-full" placeholder="输入值..." />`;
      }
    } else {
      // 无字典：普通输入框
      document.getElementById(`input-${a.id}`).innerHTML =
        `<input id="attr-${a.id}" class="border rounded px-2 py-1 text-sm w-full" placeholder="输入值..." />`;
    }
  }
}


  </script>
</body>
</html>
