<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Ozon 类目属性助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-7xl mx-auto p-6 space-y-6">
    <h1 class="text-3xl font-bold">Ozon 类目属性助手</h1>
    <p class="text-sm text-gray-600">支持中文类目树选择 + 自动加载必填/选填属性</p>

    <!-- 控制区 -->
    <div class="flex items-center gap-3">
      <select id="lang" class="border rounded-lg p-2">
        <option value="ZH_HANS">ZH_HANS (中文)</option>
        <option value="RU">RU (俄语)</option>
      </select>
      <button id="btn-tree" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">获取类目树</button>
      <button id="btn-refresh" class="px-4 py-2 bg-orange-500 text-white rounded-lg hover:bg-orange-600">强制刷新类目树</button>
      <span id="status" class="text-sm text-gray-600"></span>
    </div>

    <!-- 下拉菜单 -->
    <div class="flex gap-3">
      <select id="lvl1" class="border rounded-lg p-2 w-1/3"><option>选择一级类目</option></select>
      <select id="lvl2" class="border rounded-lg p-2 w-1/3"><option>选择二级类目</option></select>
      <select id="lvl3" class="border rounded-lg p-2 w-1/3"><option>选择三级类目</option></select>
    </div>

    <!-- 属性展示区 -->
    <div id="attr-section" class="hidden">
      <div class="flex items-center justify-between mt-4">
        <h2 class="text-2xl font-semibold">类目属性</h2>
        <button id="btn-attr-refresh" class="px-3 py-1 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600">刷新属性</button>
      </div>
      <div id="attr-out" class="mt-3 bg-white p-4 rounded-xl shadow-sm border space-y-3 max-h-[500px] overflow-auto"></div>
    </div>

    <pre id="out" class="bg-gray-100 p-3 rounded-lg text-xs overflow-auto max-h-96"></pre>
  </div>

  <script>
    const proxy = async (endpoint, body = {}, refresh = false) => {
      const res = await fetch(`/api/ozon-proxy?endpoint=${encodeURIComponent(endpoint)}&refresh=${refresh}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return res.json();
    };

    const out = document.getElementById('out');
    const statusEl = document.getElementById('status');
    const attrSection = document.getElementById('attr-section');
    const attrOut = document.getElementById('attr-out');
    let categoryTree = [];
    let selectedCategoryId = null;

    // 获取类目树
    async function loadCategoryTree(refresh = false) {
      out.textContent = "正在获取类目树...";
      const language = document.getElementById('lang').value;
      const { ok, fromCache, data } = await proxy('/v1/description-category/tree', { language }, refresh);
      if (!ok) {
        out.textContent = JSON.stringify(data, null, 2);
        return;
      }
      categoryTree = data.result || [];
      statusEl.textContent = fromCache ? "✅ 从缓存加载" : "🆕 从 API 获取";
      renderLevel(1, categoryTree);
      out.textContent = "类目树加载成功。";
    }

    // 渲染下拉
    function renderLevel(level, list) {
      const s1 = document.getElementById('lvl1');
      const s2 = document.getElementById('lvl2');
      const s3 = document.getElementById('lvl3');
      if (level === 1) {
        s1.innerHTML = '<option value="">选择一级类目</option>' +
          list.map(i => `<option value="${i.description_category_id}">${i.category_name}</option>`).join('');
        s1.onchange = () => {
          const sel = list.find(i => i.description_category_id == s1.value);
          renderLevel(2, sel?.children || []);
          s3.innerHTML = '<option>选择三级类目</option>';
          attrSection.classList.add('hidden');
        };
      } else if (level === 2) {
        s2.innerHTML = '<option value="">选择二级类目</option>' +
          list.map(i => `<option value="${i.description_category_id}">${i.category_name}</option>`).join('');
        s2.onchange = () => {
          const sel = list.find(i => i.description_category_id == s2.value);
          renderLevel(3, sel?.children || []);
          attrSection.classList.add('hidden');
        };
      } else if (level === 3) {
        s3.innerHTML = '<option value="">选择三级类目</option>' +
          list.map(i => `<option value="${i.type_id}">${i.type_name || i.category_name}</option>`).join('');
        s3.onchange = async () => {
          selectedCategoryId = s3.value;
          if (selectedCategoryId) await loadAttributes(selectedCategoryId);
        };
      }
    }

    // 获取属性
    async function loadAttributes(categoryId, refresh = false) {
      attrOut.textContent = '正在加载属性...';
      const language = document.getElementById('lang').value;
      const { ok, data } = await proxy('/v1/description-category/attribute', { category_id: Number(categoryId), language }, refresh);
      if (!ok) {
        attrOut.textContent = JSON.stringify(data, null, 2);
        return;
      }
      const attrs = data.result || [];
      renderAttributes(attrs);
    }

    // 渲染属性
    function renderAttributes(attrs) {
      if (!attrs.length) {
        attrSection.classList.remove('hidden');
        attrOut.innerHTML = '<p class="text-gray-500">该类目暂无属性。</p>';
        return;
      }
      attrSection.classList.remove('hidden');
      attrOut.innerHTML = attrs.map(a => `
        <div class="p-3 border rounded-lg ${a.is_required ? 'border-red-400 bg-red-50' : 'border-green-300 bg-green-50'}">
          <div class="flex justify-between items-center">
            <h4 class="font-semibold text-sm">${a.name}</h4>
            ${a.is_required
              ? '<span class="text-red-600 text-xs font-bold">必填</span>'
              : '<span class="text-green-600 text-xs">选填</span>'}
          </div>
          <p class="text-xs text-gray-600 mt-1">类型: ${a.type} | 示例: ${a.dictionary_id ? '字典选择' : '文本/数值输入'}</p>
        </div>
      `).join('');
    }

    document.getElementById('btn-tree').addEventListener('click', () => loadCategoryTree(false));
    document.getElementById('btn-refresh').addEventListener('click', () => loadCategoryTree(true));
    document.getElementById('btn-attr-refresh').addEventListener('click', () => {
      if (selectedCategoryId) loadAttributes(selectedCategoryId, true);
    });
  </script>
</body>
</html>
