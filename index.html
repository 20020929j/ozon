<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ozon 智能上架助手 v1</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-6xl mx-auto p-6">
    <header class="mb-6">
      <h1 class="text-3xl font-bold">Ozon 智能上架助手 v1</h1>
      <p class="text-sm text-gray-600 mt-1">通过 Vercel 代理安全调用 Ozon Seller API · 界面仅中文</p>
    </header>

<script>
    // 封装 API 代理请求
    const proxy = async (endpoint, body = {}, query = '') => {
      const res = await fetch(`/api/ozon-proxy?endpoint=${encodeURIComponent(endpoint)}${query || ''}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, data };
    };

    // 测试代理
    document.getElementById('btn-ping').addEventListener('click', async () => {
      const out = document.getElementById('ping-out');
      out.textContent = '测试中…';
      try {
        const res = await fetch('/api/ozon-proxy');
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        out.textContent = e.message || String(e);
      }
    });

    // ① 获取类目树
    document.getElementById('btn-tree').addEventListener('click', async () => {
      const out = document.getElementById('tree-out');
      out.textContent = '请求中…';
      const language = document.getElementById('lang').value;
      const body = { language };
      const { ok, status, data } = await proxy('/v2/description-category/tree', body);
      out.textContent = JSON.stringify({ ok, status, data }, null, 2);
    });

    // ② 获取类目属性
    document.getElementById('btn-attr').addEventListener('click', async () => {
      const out = document.getElementById('attr-out');
      out.textContent = '请求中…';
      const category_id = Number(document.getElementById('cat-id').value || 0);
      const language = document.getElementById('attr-lang').value;
      const body = { category_id, language };
      const { ok, status, data } = await proxy('/v1/description-category/attribute', body);
      out.textContent = JSON.stringify({ ok, status, data }, null, 2);
    });

    // ③ 上传商品
    document.getElementById('btn-upload').addEventListener('click', async () => {
      const out = document.getElementById('upload-out');
      out.textContent = '上传中…';
      try {
        const body = JSON.parse(document.getElementById('product-json').value || '{}');
        const { ok, status, data } = await proxy('/v3/product/import', body);
        out.textContent = JSON.stringify({ ok, status, data }, null, 2);
      } catch (e) {
        out.textContent = 'JSON 解析失败：' + (e.message || e);
      }
    });

    // 格式化 JSON
    document.getElementById('btn-format').addEventListener('click', () => {
      const ta = document.getElementById('product-json');
      try { ta.value = JSON.stringify(JSON.parse(ta.value), null, 2); } catch {}
    });

    // ④ 自定义请求
    document.getElementById('btn-custom').addEventListener('click', async () => {
      const out = document.getElementById('custom-out');
      out.textContent = '请求中…';
      const endpoint = document.getElementById('custom-endpoint').value.trim();
      const query = document.getElementById('custom-query').value.trim();
      let body = {};
      try { body = JSON.parse(document.getElementById('custom-body').value || '{}'); } catch (e) {
        out.textContent = 'JSON 解析失败：' + (e.message || e);
        return;
      }
      const { ok, status, data } = await proxy(endpoint, body, query);
      out.textContent = JSON.stringify({ ok, status, data }, null, 2);
    });
  </script>
</body>
</html>
