<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <title>Ozon 类目属性助手 v6.7（上传整合优化稳定版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      margin: 20px;
    }
    h1 {
      color: #222;
    }
    .toolbar {
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    select, input, textarea, button {
      font-size: 14px;
      padding: 6px 8px;
      margin: 4px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      cursor: pointer;
    }
    .btn-primary {
      background-color: #1677ff;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
    }
    .btn-danger {
      background-color: #ff4d4f;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
    }
    .section {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 0 6px rgba(0,0,0,0.1);
    }
    .required {
      color: red;
      font-weight: bold;
    }
    .result {
      white-space: pre-wrap;
      background: #fafafa;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
      max-height: 200px;
      overflow: auto;
    }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>🧩 Ozon 类目属性助手 v6.7（上传整合优化版）</h1>

  <div class="toolbar">
    <button id="checkApi" class="btn-primary">验证 API 连接</button>
    <select id="language">
      <option value="ZH_HANS">中文</option>
      <option value="RU">Русский</option>
    </select>
    <button id="getCategories" class="btn-primary">获取类目树</button>
    <button id="clearCache" class="btn-danger">清除缓存</button>
    <span id="statusText"></span>
  </div>

  <div class="toolbar">
    <select id="cat1"><option>请选择一级类目</option></select>
    <select id="cat2"><option>请选择二级类目</option></select>
    <select id="cat3"><option>请选择三级类目</option></select>
  </div>

  <div class="section">
    <h3>📦 商品上传</h3>
    <input type="text" id="offer_id" placeholder="商品唯一标识 offer_id" style="width:48%">
    <input type="text" id="name" placeholder="商品名称" style="width:48%"><br>
    <input type="text" id="barcode" placeholder="条形码" style="width:48%">
    <input type="number" id="price" placeholder="价格 (数字)" style="width:48%"><br>
    <select id="currency" style="width:48%">
      <option value="RUB">RUB</option>
      <option value="CNY">CNY</option>
      <option value="USD">USD</option>
    </select>
    <input type="number" id="vat" placeholder="增值税率 (0 或 20)" style="width:48%"><br>
    <input type="number" id="depth" placeholder="深度 cm" style="width:31%">
    <input type="number" id="width" placeholder="宽度 cm" style="width:31%">
    <input type="number" id="height" placeholder="高度 cm" style="width:31%"><br>
    <input type="number" id="weight" placeholder="重量 kg" style="width:31%"><br>
    <textarea id="images" placeholder="图片链接（每行一张，最多30张）" style="width:98%;height:100px;"></textarea><br>
    <button id="uploadBtn" class="btn-primary">🚀 发布商品</button>
  </div>

  <div id="resultBox" class="result"></div>

  <script>
    const apiBase = '/.netlify/functions';

    // 验证 API
    document.getElementById('checkApi').onclick = async () => {
      document.getElementById('statusText').textContent = '正在验证...';
      const res = await fetch(`${apiBase}/check-api`);
      const data = await res.json();
      if (data.success) {
        document.getElementById('statusText').textContent = '✅ 连接成功';
        document.getElementById('statusText').className = 'success';
      } else {
        document.getElementById('statusText').textContent = '❌ ' + (data.error || '连接失败');
        document.getElementById('statusText').className = 'error';
      }
    };

    // 获取类目树
    document.getElementById('getCategories').onclick = async () => {
      const lang = document.getElementById('language').value;
      const res = await fetch(`${apiBase}/get-category-tree`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ language: lang })
      });
      const data = await res.json();
      if (!data.success) {
        alert('❌ 获取类目失败: ' + data.error);
        return;
      }
      const cat1 = document.getElementById('cat1');
      cat1.innerHTML = '<option>请选择一级类目</option>';
      data.result.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.category_id;
        opt.textContent = item.name;
        cat1.appendChild(opt);
      });
      alert('✅ 类目树加载成功');
    };

    // 发布商品
    document.getElementById('uploadBtn').onclick = async () => {
      const body = {
        items: [{
          offer_id: document.getElementById('offer_id').value,
          name: document.getElementById('name').value,
          barcode: document.getElementById('barcode').value,
          price: Number(document.getElementById('price').value),
          currency_code: document.getElementById('currency').value,
          vat: Number(document.getElementById('vat').value),
          depth: Number(document.getElementById('depth').value),
          width: Number(document.getElementById('width').value),
          height: Number(document.getElementById('height').value),
          weight: Number(document.getElementById('weight').value),
          images: document.getElementById('images').value.split('\n').filter(Boolean)
        }]
      };

      document.getElementById('resultBox').textContent = '⏳ 上传中...';
      const res = await fetch(`${apiBase}/upload-product`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      document.getElementById('resultBox').textContent = JSON.stringify(data, null, 2);
      document.getElementById('resultBox').className = data.success ? 'result success' : 'result error';
    };
  </script>
</body>
</html>
