<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Ozon 类目属性助手</title>
<style>
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #f6f7fb;
    margin: 30px;
    color: #333;
  }
  h2 {
    margin-bottom: 20px;
  }
  select, button, input[type="checkbox"] {
    margin: 5px;
    padding: 6px;
    font-size: 15px;
  }
  #result {
    background: #fff;
    border-radius: 10px;
    padding: 15px;
    margin-top: 20px;
    white-space: pre-wrap;
    border: 1px solid #ddd;
  }
  .attr-item {
    margin: 6px 0;
    padding: 8px 12px;
    border-radius: 5px;
  }
  .required {
    border-left: 5px solid #e74c3c;
    background: #fdecea;
  }
  .optional {
    border-left: 5px solid #27ae60;
    background: #e8f8f0;
  }
</style>
</head>
<body>
<h2>Ozon 类目属性助手（中文类目三级下拉 + 自动标注必填/选填）</h2>

<div>
  <label>语言：</label>
  <select id="lang">
    <option value="ZH_HANS">ZH_HANS (中文)</option>
    <option value="RU">RU (俄语)</option>
    <option value="EN">EN (英语)</option>
  </select>
  <button id="loadTree">获取类目树</button>
  <button id="forceReload">强制刷新类目</button>
</div>

<div>
  <select id="level1"></select>
  <select id="level2"></select>
  <select id="level3"></select>
  <button id="loadAttr">刷新属性</button>
  <label><input type="checkbox" id="showRequiredOnly"> 仅显示必填项</label>
</div>

<div id="result">类目属性加载中...</div>

<script>
const API_BASE = "/v1"; // 你的代理接口前缀
const treeCacheKey = "ozon_category_tree";

const s1 = document.getElementById("level1");
const s2 = document.getElementById("level2");
const s3 = document.getElementById("level3");
const resultDiv = document.getElementById("result");

let categoryTree = null;

// 从本地缓存加载类目树
function loadFromCache() {
  const data = localStorage.getItem(treeCacheKey);
  if (data) {
    categoryTree = JSON.parse(data);
    console.log("类目树已从缓存加载");
    return true;
  }
  return false;
}

// 保存类目树到缓存
function saveToCache(data) {
  localStorage.setItem(treeCacheKey, JSON.stringify(data));
}

// 加载类目树
async function loadTree(force = false) {
  if (!force && loadFromCache()) {
    fillSelectLevel1();
    return;
  }
  const lang = document.getElementById("lang").value;
  resultDiv.textContent = "正在获取类目树...";
  const res = await fetch(`${API_BASE}/description-category/tree`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ language: lang })
  });
  const json = await res.json();
  if (json?.result) {
    categoryTree = json.result;
    saveToCache(categoryTree);
    fillSelectLevel1();
    resultDiv.textContent = "类目树加载成功 ✅";
  } else {
    resultDiv.textContent = "加载失败：" + JSON.stringify(json);
  }
}

// 填充第一级
function fillSelectLevel1() {
  s1.innerHTML = categoryTree.map(c => `<option value="${c.description_category_id}">${c.category_name}</option>`).join("");
  handleLevel1Change();
}
function handleLevel1Change() {
  const item = categoryTree.find(c => c.description_category_id == s1.value);
  if (!item) return;
  s2.innerHTML = item.children.map(c => `<option value="${c.description_category_id}">${c.category_name}</option>`).join("");
  handleLevel2Change();
}
function handleLevel2Change() {
  const item1 = categoryTree.find(c => c.description_category_id == s1.value);
  if (!item1) return;
  const item2 = item1.children.find(c => c.description_category_id == s2.value);
  if (!item2) return;
  s3.innerHTML = item2.children.map(c => `<option value="${c.type_id}">${c.type_name}</option>`).join("");
}

// 获取属性信息
async function loadAttributes(typeId) {
  if (!typeId) return;
  resultDiv.textContent = "正在获取属性...";
  const lang = document.getElementById("lang").value;
  const res = await fetch(`${API_BASE}/description-category/attribute`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      language: lang,
      description_category_id: Number(typeId)
    })
  });
  const json = await res.json();
  if (json?.result?.length) {
    renderAttributes(json.result);
  } else {
    resultDiv.textContent = "获取失败：" + JSON.stringify(json);
  }
}

// 渲染属性
function renderAttributes(list) {
  const showRequiredOnly = document.getElementById("showRequiredOnly").checked;
  const html = list
    .filter(a => !showRequiredOnly || a.is_required)
    .map(a => `
      <div class="attr-item ${a.is_required ? "required" : "optional"}">
        <strong>${a.name}</strong><br/>
        ID: ${a.id}<br/>
        ${a.is_required ? "必填项" : "选填项"}
      </div>
    `)
    .join("");
  resultDiv.innerHTML = html || "此类目暂无属性。";
}

// 事件绑定
s1.onchange = handleLevel1Change;
s2.onchange = handleLevel2Change;
s3.onchange = async () => {
  const typeId = Number(s3.value);
  if (typeId) await loadAttributes(typeId);
};
document.getElementById("loadTree").onclick = () => loadTree(false);
document.getElementById("forceReload").onclick = () => loadTree(true);
document.getElementById("loadAttr").onclick = () => {
  const typeId = Number(s3.value);
  if (typeId) loadAttributes(typeId);
};
document.getElementById("showRequiredOnly").onchange = () => {
  const typeId = Number(s3.value);
  if (typeId) loadAttributes(typeId);
};

// 初始化
loadTree();
</script>
</body>
</html>
