<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ozon 类目选择助手 v3</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-6xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">Ozon 类目树 - 中文三级下拉选择</h1>

    <div class="mb-4">
      <label class="text-sm">语言：</label>
      <select id="lang" class="border rounded-xl p-2">
        <option value="ZH_HANS">ZH_HANS（中文）</option>
        <option value="RU">RU（俄语）</option>
      </select>
      <button id="btn-tree" class="ml-2 px-4 py-2 bg-blue-600 text-white rounded-xl">获取类目树</button>
    </div>

    <div id="category-selectors" class="grid grid-cols-3 gap-4 hidden">
      <select id="level1" class="border rounded-xl p-2"></select>
      <select id="level2" class="border rounded-xl p-2"></select>
      <select id="level3" class="border rounded-xl p-2"></select>
    </div>

    <p id="status" class="mt-3 text-sm text-gray-600"></p>
    <pre id="tree-out" class="mt-4 bg-gray-100 rounded-xl p-3 text-xs overflow-auto max-h-80"></pre>
  </div>

  <script>
    // 后端代理请求
    const proxy = async (endpoint, body = {}) => {
      const res = await fetch(`/api/ozon-proxy?endpoint=${encodeURIComponent(endpoint)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, data };
    };

    const fillOptions = (select, list, labelKey, idKey, placeholder) => {
      select.innerHTML = `<option value="">${placeholder}</option>`;
      list.forEach(item => {
        const opt = document.createElement("option");
        opt.value = item[idKey];
        opt.textContent = item[labelKey];
        select.appendChild(opt);
      });
    };

    document.getElementById("btn-tree").addEventListener("click", async () => {
      const out = document.getElementById("tree-out");
      const status = document.getElementById("status");
      const lang = document.getElementById("lang").value;
      out.textContent = "加载中...";
      status.textContent = "";

      const { ok, data } = await proxy("/v1/description-category/tree", { language: lang });
      out.textContent = JSON.stringify(data, null, 2);

      if (!ok || !data?.result) {
        status.textContent = "❌ 获取失败，请检查代理或 API KEY";
        return;
      }

      // 显示三级下拉
      document.getElementById("category-selectors").classList.remove("hidden");
      const level1 = document.getElementById("level1");
      const level2 = document.getElementById("level2");
      const level3 = document.getElementById("level3");

      fillOptions(level1, data.result, "category_name", "description_category_id", "选择一级类目");
      fillOptions(level2, [], "category_name", "description_category_id", "选择二级类目");
      fillOptions(level3, [], "type_name", "type_id", "选择三级类目");

      // 一级联动
      level1.onchange = () => {
        const first = data.result.find(x => x.description_category_id == level1.value);
        fillOptions(level2, first?.children || [], "category_name", "description_category_id", "选择二级类目");
        fillOptions(level3, [], "type_name", "type_id", "选择三级类目");
      };

      // 二级联动
      level2.onchange = () => {
        const first = data.result.find(x => x.description_category_id == level1.value);
        const second = first?.children?.find(y => y.description_category_id == level2.value);
        fillOptions(level3, second?.children || [], "type_name", "type_id", "选择三级类目");
      };

      // 第三级变化
      level3.onchange = () => {
        const val = level3.value;
        if (val) {
          status.textContent = `✅ 已选择第三级类目 ID: ${val}`;
        } else {
          status.textContent = "";
        }
      };
    });
  </script>
</body>
</html>
