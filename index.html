<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Ozon 类目属性助手 v5（含属性填写与商品上传）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">
  <div class="max-w-7xl mx-auto p-6 space-y-6">
    <h1 class="text-2xl font-bold">Ozon 类目属性助手 v5</h1>

    <!-- ✅ 顶部操作栏 -->
    <div class="flex flex-wrap gap-3 items-center">
      <button id="btnPing" class="px-4 py-2 rounded bg-gray-700 text-white hover:bg-gray-800">
        🔍 验证 API 连接
      </button>
      <span id="pingStatus" class="text-sm text-gray-600"></span>

      <label class="ml-6 text-sm">语言：</label>
      <select id="lang" class="border rounded px-3 py-2">
        <option value="ZH_HANS">中文</option>
        <option value="RU">俄语</option>
        <option value="EN">英语</option>
      </select>

      <button id="btnLoadTree" class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">
        获取类目树
      </button>

      <button id="btnForceReload" class="px-4 py-2 rounded bg-orange-600 text-white hover:bg-orange-700">
        清除缓存
      </button>

      <label class="inline-flex items-center ml-4">
        <input id="onlyRequired" type="checkbox" class="mr-2" /> 仅显示必填
      </label>
    </div>

    <!-- ✅ 类目下拉 -->
    <div class="grid md:grid-cols-3 gap-3">
      <select id="c1" class="w-full border rounded px-3 py-2"><option>请获取类目树...</option></select>
      <select id="c2" class="w-full border rounded px-3 py-2"></select>
      <select id="c3" class="w-full border rounded px-3 py-2"></select>
    </div>

    <div id="tips" class="text-sm text-gray-500">请选择二级类目和三级类型后自动获取属性</div>

    <!-- ✅ 属性面板 -->
    <div id="attrPanel" class="bg-white rounded-2xl shadow p-4">
      <div id="attrLoading" class="text-sm text-gray-600">尚未加载属性...</div>
      <div id="attrList" class="hidden">
        <div class="flex items-center justify-between mb-3">
          <div class="text-sm text-gray-500"><span id="counter"></span></div>
          <input id="attrSearch" type="text" class="border rounded px-3 py-1 text-sm" placeholder="搜索属性..." />
        </div>
        <div id="attrCards" class="grid gap-3"></div>
      </div>
    </div>

    <!-- ✅ 新增：商品上传模块 -->
    <div class="bg-white rounded-2xl shadow p-4">
      <h2 class="font-semibold text-lg mb-2">📦 商品上传 / 更新</h2>
      <p class="text-xs text-gray-500 mb-3">支持图片、视频及完整商品信息，接口：<code>/v3/product/import</code></p>

      <div class="grid md:grid-cols-2 gap-3 text-sm">
        <label>Offer ID<input id="offerId" class="border rounded px-3 py-2 w-full" placeholder="唯一编码" /></label>
        <label>商品标题<input id="prodName" class="border rounded px-3 py-2 w-full" /></label>
        <label>价格<input id="prodPrice" type="number" class="border rounded px-3 py-2 w-full" /></label>
        <label>货币<select id="currency" class="border rounded px-3 py-2 w-full"><option>RUB</option><option>CNY</option><option>USD</option></select></label>
        <label>VAT<select id="vat" class="border rounded px-3 py-2 w-full"><option>0</option><option>10</option><option>20</option></select></label>
        <label>条形码<input id="barcode" class="border rounded px-3 py-2 w-full" /></label>
        <label>长度(cm)<input id="depth" type="number" class="border rounded px-3 py-2 w-full" /></label>
        <label>宽度(cm)<input id="width" type="number" class="border rounded px-3 py-2 w-full" /></label>
        <label>高度(cm)<input id="height" type="number" class="border rounded px-3 py-2 w-full" /></label>
        <label>重量(kg)<input id="weight" type="number" class="border rounded px-3 py-2 w-full" /></label>
      </div>

      <label class="block mt-3 text-sm">商品描述<textarea id="prodDesc" class="border rounded px-3 py-2 w-full h-32"></textarea></label>

      <label class="block mt-3 text-sm">图片链接（每行一个）<textarea id="imgLinks" class="border rounded px-3 py-2 w-full h-24" placeholder="https://...jpg"></textarea></label>

      <div class="grid md:grid-cols-2 gap-3 mt-3">
        <label>视频链接<input id="videoUrl" class="border rounded px-3 py-2 w-full" placeholder="https://youtube.com/..." /></label>
        <label>视频标题<input id="videoName" class="border rounded px-3 py-2 w-full" /></label>
      </div>

      <div class="mt-4 flex items-center gap-3">
        <button id="btnUpload" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">🚀 上传商品</button>
        <span id="uploadStatus" class="text-sm text-gray-600"></span>
      </div>

      <pre id="uploadResult" class="bg-gray-100 text-xs p-3 rounded mt-3 overflow-auto max-h-72"></pre>
    </div>
  </div>

  <script>
    // 公共函数
    const ozon = async (endpoint, body = null) => {
      const opts = body
        ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
        : { method: 'GET' };
      const res = await fetch('/api/ozon-proxy?endpoint=' + encodeURIComponent(endpoint), opts);
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.error || JSON.stringify(data));
      return data.data || data;
    };

    // 状态
    let TREE = [], C1 = [], C2 = [], C3 = [];
    let currentC2 = 0, currentType = 0;
    let ATTR_ALL = [];
    let LANG = 'ZH_HANS';

    // DOM
    const $btnPing = document.getElementById('btnPing');
    const $pingStatus = document.getElementById('pingStatus');
    const $btnLoadTree = document.getElementById('btnLoadTree');
    const $btnForceReload = document.getElementById('btnForceReload');
    const $c1 = document.getElementById('c1'), $c2 = document.getElementById('c2'), $c3 = document.getElementById('c3');
    const $tips = document.getElementById('tips');
    const $attrLoading = document.getElementById('attrLoading');
    const $attrList = document.getElementById('attrList');
    const $attrCards = document.getElementById('attrCards');
    const $counter = document.getElementById('counter');
    const $attrSearch = document.getElementById('attrSearch');
    const $onlyRequired = document.getElementById('onlyRequired');
    const $lang = document.getElementById('lang');
    const $uploadResult = document.getElementById('uploadResult');
    const $uploadStatus = document.getElementById('uploadStatus');

    $lang.addEventListener('change', () => (LANG = $lang.value));

    // 验证 API
    $btnPing.onclick = async () => {
      $pingStatus.textContent = '检测中...';
      try {
        const proxyOk = await fetch('/api/ozon-proxy').then(r => r.json());
        if (!proxyOk.ok) throw new Error('代理异常');
        const apiOk = await ozon('/v1/description-category/tree', { language: 'RU' });
        $pingStatus.textContent = `✅ 连接成功 (${apiOk.result.length} 类)`;
      } catch (e) {
        $pingStatus.textContent = '❌ ' + e.message;
      }
    };

    // 填充下拉
    const fillSelect = (sel, arr, ph) => {
      sel.innerHTML = `<option value="">${ph}</option>` + arr.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
    };

    // 加载类目
    $btnLoadTree.onclick = async () => {
      $tips.textContent = '正在加载类目...';
      const cacheKey = 'OZON_TREE_' + LANG;
      const cached = localStorage.getItem(cacheKey);
      if (cached) {
        TREE = JSON.parse(cached);
        fillSelect($c1, TREE.map(c => ({ id: c.description_category_id, name: c.category_name, children: c.children })), '一级类目');
        $tips.textContent = '✅ 已从缓存加载';
        return;
      }
      try {
        const r = await ozon('/v1/description-category/tree', { language: LANG });
        TREE = r.result || [];
        localStorage.setItem(cacheKey, JSON.stringify(TREE));
        fillSelect($c1, TREE.map(c => ({ id: c.description_category_id, name: c.category_name, children: c.children })), '一级类目');
        $tips.textContent = '✅ 类目树加载成功';
      } catch (e) {
        $tips.textContent = '❌ 加载失败：' + e.message;
      }
    };

    $btnForceReload.onclick = () => {
      localStorage.removeItem('OZON_TREE_' + LANG);
      alert('缓存已清除');
    };

    // 类目联动
    $c1.onchange = () => {
      const n = TREE.find(x => x.description_category_id == $c1.value);
      C2 = n?.children?.map(c => ({ id: c.description_category_id, name: c.category_name, children: c.children })) || [];
      fillSelect($c2, C2, '二级类目');
      fillSelect($c3, [], '三级类型');
    };
    $c2.onchange = () => {
      const n = C2.find(x => x.id == $c2.value);
      C3 = n?.children?.map(t => ({ id: t.type_id, name: t.type_name })) || [];
      fillSelect($c3, C3, '三级类型');
      currentC2 = Number($c2.value);
    };
    $c3.onchange = () => {
      currentType = Number($c3.value);
      if (currentC2 && currentType) loadAttrs();
    };

    // 加载属性
    async function loadAttrs() {
      try {
        $attrLoading.textContent = '获取属性中...';
        const r = await ozon('/v1/description-category/attribute', { description_category_id: currentC2, type_id: currentType, language: LANG });
        ATTR_ALL = r.result || [];
        renderAttrs();
        $attrLoading.classList.add('hidden');
        $attrList.classList.remove('hidden');
        $tips.textContent = `✅ 已加载 ${ATTR_ALL.length} 条属性`;
      } catch (e) {
        $attrLoading.textContent = '❌ ' + e.message;
      }
    }

    // 渲染属性
    const renderAttrs = async () => {
      const onlyReq = $onlyRequired.checked;
      const kw = ($attrSearch.value || '').toLowerCase();
      const list = ATTR_ALL.filter(a => (!onlyReq || a.is_required) && (!kw || a.name.toLowerCase().includes(kw)))
        .sort((a, b) => Number(b.is_required) - Number(a.is_required));

      $counter.textContent = `显示 ${list.length} / ${ATTR_ALL.length}`;
      $attrCards.innerHTML = '';

      for (const a of list) {
        const card = document.createElement('div');
        card.className = 'border rounded p-3';
        const title = `<div class="flex justify-between"><div class="font-medium">${a.name} ${a.is_required ? '<span class="text-red-600">(必填)</span>' : '<span class="text-green-600">(选填)</span>'}</div><div class="text-xs text-gray-500">ID: ${a.id}</div></div>`;
        const desc = `<div class="text-xs text-gray-500 mt-1">${a.description || ''}</div>`;
        let inputHTML = '';
        if (a.dictionary_id > 0) {
          const dict = await ozon('/v1/description-category/attribute/values', {
            attribute_id: a.id, description_category_id: currentC2, type_id: currentType, limit: 2000, language: LANG
          });
          const vals = dict.result || [];
          inputHTML = `<input list="d-${a.id}" id="in-${a.id}" class="border rounded px-2 py-1 text-xs w-full mt-2" placeholder="输入或选择..." />
          <datalist id="d-${a.id}">${vals.map(v => `<option value="${v.value}"></option>`).join('')}</datalist>`;
        } else {
          inputHTML = `<input id="in-${a.id}" class="border rounded px-2 py-1 text-xs w-full mt-2" placeholder="填写值..." />`;
        }
        card.innerHTML = title + desc + inputHTML;
        $attrCards.appendChild(card);
      }
    };

    $onlyRequired.onchange = renderAttrs;
    $attrSearch.oninput = renderAttrs;

    // 上传商品
    document.getElementById('btnUpload').onclick = async () => {
      try {
        $uploadStatus.textContent = '⏳ 上传中...';
        const imgs = (document.getElementById('imgLinks').value || '').split(/\n/).filter(x => x.trim()).map(u => ({ file_name: u.trim() }));
        const attrs = ATTR_ALL.map(a => {
          const val = document.getElementById('in-' + a.id)?.value;
          if (!val) return null;
          return { attribute_id: a.id, values: [{ value: val }] };
        }).filter(Boolean);
        const videoUrl = document.getElementById('videoUrl').value.trim();
        const videoName = document.getElementById('videoName').value.trim();
        const body = {
          items: [{
            offer_id: document.getElementById('offerId').value,
            category_id: currentC2,
            name: document.getElementById('prodName').value,
            price: document.getElementById('prodPrice').value,
            currency_code: document.getElementById('currency').value,
            vat: document.getElementById('vat').value,
            barcode: document.getElementById('barcode').value,
            description: document.getElementById('prodDesc').value,
            images: imgs,
            attributes: attrs,
            depth: Number(document.getElementById('depth').value),
            width: Number(document.getElementById('width').value),
            height: Number(document.getElementById('height').value),
            weight: Number(document.getElementById('weight').value),
            complex_attributes: videoUrl ? [{
              complex_id: 100001,
              id: 21841,
              values: [{ value: videoUrl }]
            }, {
              complex_id: 100001,
              id: 21837,
              values: [{ value: videoName }]
            }] : []
          }]
        };
        const res = await ozon('/v3/product/import', body);
        $uploadResult.textContent = JSON.stringify(res, null, 2);
        $uploadStatus.textContent = '✅ 上传完成';
      } catch (e) {
        $uploadStatus.textContent = '❌ 上传失败：' + e.message;
      }
    };
  </script>
</body>
</html>
