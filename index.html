<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Ozon 类目属性助手 v6（上传商品版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-7xl mx-auto p-6 space-y-6">
    <h1 class="text-2xl font-bold">🛒 Ozon 类目属性助手 v6（上传商品）</h1>

    <!-- 顶部操作 -->
    <div class="flex flex-wrap gap-3 items-center">
      <button id="btnPing" class="px-4 py-2 rounded bg-gray-700 text-white hover:bg-gray-800">🔍 验证 API 连接</button>
      <span id="pingStatus" class="text-sm text-gray-600"></span>
      <label class="ml-4 text-sm">语言：</label>
      <select id="lang" class="border rounded px-3 py-2">
        <option value="ZH_HANS">ZH_HANS（中文）</option>
        <option value="RU">RU（俄语）</option>
        <option value="EN">EN（英语）</option>
      </select>
      <button id="btnLoadTree" class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">获取类目树</button>
      <button id="btnForceReload" class="px-4 py-2 rounded bg-orange-600 text-white hover:bg-orange-700">清除缓存</button>
    </div>

    <!-- 类目选择 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <select id="c1" class="border rounded px-3 py-2"><option>请获取类目树...</option></select>
      <select id="c2" class="border rounded px-3 py-2"></select>
      <select id="c3" class="border rounded px-3 py-2"></select>
    </div>

    <div id="tips" class="text-sm text-gray-500">请选择三级类目以加载属性</div>

    <!-- 属性区 -->
    <div id="attrPanel" class="bg-white rounded-2xl shadow p-4">
      <div id="attrLoading" class="text-sm text-gray-600">尚未加载属性...</div>
      <div id="attrList" class="hidden">
        <div class="flex justify-between mb-3">
          <span id="counter" class="text-sm text-gray-500"></span>
          <input id="attrSearch" type="text" placeholder="搜索属性..." class="border rounded px-2 py-1 text-sm" />
        </div>
        <div id="attrCards" class="grid gap-3"></div>
      </div>
    </div>

    <!-- 上传商品模块 -->
    <section class="bg-white rounded-2xl shadow p-4">
      <h2 class="text-lg font-semibold mb-3">📦 商品上传</h2>
      <p class="text-xs text-gray-500 mb-2">根据 Ozon 官方接口 /v3/product/import 规范上传商品</p>

      <div class="grid md:grid-cols-2 gap-3">
        <input id="offerId" class="border rounded px-3 py-2" placeholder="商品唯一标识 offer_id" />
        <input id="productName" class="border rounded px-3 py-2" placeholder="商品名称" />
        <input id="barcode" class="border rounded px-3 py-2" placeholder="条形码" />
        <input id="price" class="border rounded px-3 py-2" placeholder="价格（数字）" />
        <select id="currency" class="border rounded px-3 py-2">
          <option value="RUB">RUB</option>
          <option value="CNY">CNY</option>
        </select>
        <input id="vat" class="border rounded px-3 py-2" placeholder="增值税率（如 0 或 20）" />
        <input id="depth" class="border rounded px-3 py-2" placeholder="深度 cm" />
        <input id="width" class="border rounded px-3 py-2" placeholder="宽度 cm" />
        <input id="height" class="border rounded px-3 py-2" placeholder="高度 cm" />
        <input id="weight" class="border rounded px-3 py-2" placeholder="重量 kg" />
      </div>

      <hr class="my-4" />

      <h3 class="font-semibold">🖼️ 图片链接（最多30张）</h3>
      <textarea id="images" class="w-full border rounded p-2 text-xs h-24" placeholder="每行一个图片链接"></textarea>
      <input id="primaryImage" class="border rounded px-3 py-2 mt-2 w-full" placeholder="主图链接（可选）" />

      <hr class="my-4" />

      <h3 class="font-semibold">🎥 视频（可选）</h3>
      <textarea id="videos" class="w-full border rounded p-2 text-xs h-20" placeholder="视频链接（每行一个）"></textarea>
      <textarea id="videoNames" class="w-full border rounded p-2 text-xs h-20 mt-2" placeholder="视频标题（每行对应上方链接）"></textarea>

      <hr class="my-4" />

      <button id="btnUpload" class="px-4 py-2 rounded bg-green-600 text-white hover:bg-green-700">🚀 上传到 Ozon</button>
      <pre id="uploadResult" class="mt-3 text-xs bg-gray-100 p-3 rounded overflow-auto max-h-80"></pre>
    </section>
  </div>

  <script>
    // 🔧 通用代理调用
    const ozon = async (endpoint, body = null) => {
      const opts = body
        ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
        : { method: "GET" };
      const res = await fetch("/api/ozon-proxy?endpoint=" + encodeURIComponent(endpoint), opts);
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.error || JSON.stringify(data));
      return data.data || data;
    };

    let LANG = "ZH_HANS", TREE = [], C2 = [], C3 = [], currentC2 = 0, currentType = 0;

    const $ping = document.getElementById("btnPing");
    const $pingStatus = document.getElementById("pingStatus");
    const $btnLoadTree = document.getElementById("btnLoadTree");
    const $btnForceReload = document.getElementById("btnForceReload");
    const $c1 = document.getElementById("c1"), $c2 = document.getElementById("c2"), $c3 = document.getElementById("c3");
    const $tips = document.getElementById("tips");
    const $attrLoading = document.getElementById("attrLoading");
    const $attrList = document.getElementById("attrList");
    const $attrCards = document.getElementById("attrCards");
    const $counter = document.getElementById("counter");

    // ✅ 验证连接
    $ping.onclick = async () => {
      $pingStatus.textContent = "检测中...";
      try {
        const proxyOk = await fetch("/api/ozon-proxy").then(r => r.json());
        if (!proxyOk.ok) throw new Error("代理异常");
        const apiOk = await ozon("/v1/description-category/tree", { language: "RU" });
        $pingStatus.innerHTML = "✅ API 正常，共 " + apiOk.result.length + " 个一级类目";
      } catch (e) {
        $pingStatus.innerHTML = "❌ 失败：" + e.message;
      }
    };

    // 加载类目树（缓存）
    $btnLoadTree.onclick = async () => {
      $tips.textContent = "加载类目树中...";
      try {
        const resp = await ozon("/v1/description-category/tree", { language: LANG });
        TREE = resp.result;
        const C1 = TREE.map(c => ({ id: c.description_category_id, name: c.category_name, children: c.children }));
        fillSelect($c1, C1, "请选择一级类目");
        $tips.textContent = "✅ 类目加载完成";
      } catch (e) {
        $tips.textContent = "❌ 加载失败：" + e.message;
      }
    };

    $btnForceReload.onclick = () => {
      localStorage.clear();
      alert("✅ 已清除缓存");
    };

    const fillSelect = (sel, arr, ph) => {
      sel.innerHTML = `<option value="">${ph}</option>` + arr.map(a => `<option value="${a.id}">${a.name}</option>`).join("");
    };

    // 上传商品
    document.getElementById("btnUpload").onclick = async () => {
      const out = document.getElementById("uploadResult");
      out.textContent = "正在上传...";
      try {
        const payload = buildProductPayload();
        const result = await ozon("/v3/product/import", payload);
        out.textContent = JSON.stringify(result, null, 2);
      } catch (e) {
        out.textContent = "❌ 上传失败：" + e.message;
      }
    };

    // 构造商品上传 JSON
    function buildProductPayload() {
      const offer_id = document.getElementById("offerId").value.trim();
      const name = document.getElementById("productName").value.trim();
      const barcode = document.getElementById("barcode").value.trim();
      const price = document.getElementById("price").value.trim();
      const currency = document.getElementById("currency").value;
      const vat = document.getElementById("vat").value.trim();
      const depth = document.getElementById("depth").value.trim();
      const width = document.getElementById("width").value.trim();
      const height = document.getElementById("height").value.trim();
      const weight = document.getElementById("weight").value.trim();
      const images = document.getElementById("images").value.split("\n").filter(x => x);
      const primary = document.getElementById("primaryImage").value.trim();
      const videos = document.getElementById("videos").value.split("\n").filter(x => x);
      const videoNames = document.getElementById("videoNames").value.split("\n").filter(x => x);

      return {
        items: [
          {
            offer_id,
            name,
            barcode,
            price,
            currency_code: currency,
            vat,
            description: "由自动化系统上传",
            depth, width, height,
            dimension_unit: "cm",
            weight, weight_unit: "kg",
            images: images.map(url => ({ file_name: url })),
            primary_image: primary ? { file_name: primary } : undefined,
            complex_attributes: videos.length ? [
              { complex_id: 100001, id: 21841, values: videos.map(v => ({ value: v })) },
              { complex_id: 100001, id: 21837, values: videoNames.map(n => ({ value: n })) }
            ] : []
          }
        ]
      };
    }
  </script>
</body>
</html>
