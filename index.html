<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Ozon 类目&属性助手（中文三级下拉 + 自动标注必填/选填）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-7xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">
      Ozon 类目属性助手（中文三级下拉 + 自动标注必填/选填）
    </h1>

    <!-- 顶部操作栏 -->
    <div class="flex flex-wrap gap-3 items-center mb-4">
      <label class="text-sm">语言：</label>
      <select id="lang" class="border rounded px-3 py-2">
        <option value="ZH_HANS">ZH_HANS（中文）</option>
        <option value="RU">RU（俄语）</option>
        <option value="EN">EN（英语）</option>
        <option value="TR">TR（土耳其语）</option>
        <option value="DEFAULT">DEFAULT（默认俄语）</option>
      </select>

      <button id="btnLoadTree" class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">
        获取类目树
      </button>

      <label class="inline-flex items-center ml-4">
        <input id="onlyRequired" type="checkbox" class="mr-2" />
        仅显示必填项
      </label>
    </div>

    <!-- 下拉：一级、二级、三级（type） -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
      <div>
        <label class="text-sm block mb-1">一级类目：</label>
        <select id="c1" class="w-full border rounded px-3 py-2">
          <option value="">请先获取类目树...</option>
        </select>
      </div>
      <div>
        <label class="text-sm block mb-1">二级类目：</label>
        <select id="c2" class="w-full border rounded px-3 py-2">
          <option value="">请选择一级类目...</option>
        </select>
      </div>
      <div>
        <label class="text-sm block mb-1">三级（商品类型 type）：</label>
        <select id="c3" class="w-full border rounded px-3 py-2">
          <option value="">请选择二级类目...</option>
        </select>
      </div>
    </div>

    <!-- 类目/属性区域 -->
    <div class="mb-2 text-sm text-gray-500" id="tips">请选择“二级类目 + 三级类型”以自动拉取属性</div>

    <div id="attrPanel" class="bg-white rounded-2xl shadow p-4">
      <div id="attrLoading" class="text-sm text-gray-600">尚未加载属性...</div>
      <div id="attrList" class="hidden">
        <div class="flex items-center justify-between mb-3">
          <div class="text-sm text-gray-500">
            <span id="counter"></span>
          </div>
          <div>
            <input id="attrSearch" type="text" class="border rounded px-3 py-1 text-sm" placeholder="按属性名过滤..." />
          </div>
        </div>
        <div id="attrCards" class="grid gap-3"></div>
      </div>
    </div>

  </div>

  <script>
    // ======= 通用 POST 代理 =======
    async function ozon(endpoint, payload) {
      const res = await fetch('/api/ozon-proxy?endpoint=' + encodeURIComponent(endpoint), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload || {})
      });
      const data = await res.json();
      if (!res.ok || data.ok === false) {
        throw new Error((data && (data.error || data.data || data.message)) || '请求失败');
      }
      return data.data || data; // 代理把实际响应放在 data.data 里
    }

    // 状态
    let TREE = []; // /v1/description-category/tree 的结果 result
    let c1Options = []; // 一级
    let c2Options = []; // 二级
    let c3Options = []; // 三级（type）

    let currentC2Id = 0; // 二级类目 description_category_id
    let currentTypeId = 0; // 三级的 type_id
    let currentLang = 'ZH_HANS';

    // DOM
    const $lang = document.getElementById('lang');
    const $btnLoadTree = document.getElementById('btnLoadTree');
    const $c1 = document.getElementById('c1');
    const $c2 = document.getElementById('c2');
    const $c3 = document.getElementById('c3');
    const $tips = document.getElementById('tips');
    const $attrLoading = document.getElementById('attrLoading');
    const $attrList = document.getElementById('attrList');
    const $attrCards = document.getElementById('attrCards');
    const $counter = document.getElementById('counter');
    const $attrSearch = document.getElementById('attrSearch');
    const $onlyRequired = document.getElementById('onlyRequired');

    $lang.addEventListener('change', () => {
      currentLang = $lang.value || 'ZH_HANS';
    });

    // 加载类目树
    $btnLoadTree.addEventListener('click', async () => {
      try {
        $btnLoadTree.disabled = true;
        $btnLoadTree.textContent = '加载中...';
        $tips.textContent = '正在获取类目树...';
        const payload = { language: currentLang };
        const resp = await ozon('/v1/description-category/tree', payload);
        if (!resp || !resp.result) throw new Error('类目树为空');

        TREE = resp.result || [];
        // 一级
        c1Options = TREE.map(n => ({ id: n.description_category_id, name: n.category_name, children: n.children || [] }));
        fillSelect($c1, c1Options, '请选择一级类目');
        // 清空后续
        fillSelect($c2, [], '请选择一级类目...');
        fillSelect($c3, [], '请选择二级类目...');
        $tips.textContent = `类目树加载成功，共 ${c1Options.length} 个一级类目`;
      } catch (e) {
        alert('获取类目树失败：' + e.message);
      } finally {
        $btnLoadTree.disabled = false;
        $btnLoadTree.textContent = '获取类目树';
      }
    });

    // 一级变更 -> 二级
    $c1.addEventListener('change', () => {
      const id = Number($c1.value);
      const node = c1Options.find(x => x.id === id);
      c2Options = [];
      if (node && node.children && node.children.length) {
        c2Options = node.children.map(n => ({
          id: n.description_category_id,
          name: n.category_name,
          children: n.children || []
        }));
      }
      fillSelect($c2, c2Options, c2Options.length ? '请选择二级类目' : '无二级类目');
      fillSelect($c3, [], '请选择二级类目...');
      currentC2Id = 0;
      currentTypeId = 0;
      resetAttrUI();
    });

    // 二级变更 -> 三级（type）
    $c2.addEventListener('change', () => {
      const id = Number($c2.value);
      const node = c2Options.find(x => x.id === id);
      c3Options = [];
      if (node && node.children && node.children.length) {
        // 三级里是 type 列表
        c3Options = node.children.map(t => ({ id: t.type_id, name: t.type_name }));
      }
      fillSelect($c3, c3Options, c3Options.length ? '请选择三级类型' : '该二级下暂无类型');
      currentC2Id = id || 0;
      currentTypeId = 0;
      resetAttrUI();
    });

    // 三级变更 -> 获取属性
    $c3.addEventListener('change', () => {
      const typeId = Number($c3.value);
      currentTypeId = typeId || 0;
      if (currentC2Id > 0 && currentTypeId > 0) {
        loadAttributes(currentC2Id, currentTypeId, currentLang);
      } else {
        resetAttrUI();
      }
    });

    // 仅显示必填项/搜索
    $onlyRequired.addEventListener('change', filterRender);
    $attrSearch.addEventListener('input', filterRender);

    // 工具函数：填充下拉
    function fillSelect($sel, arr, placeholder) {
      const opt = [`<option value="">${placeholder || '请选择'}</option>`]
        .concat(arr.map(x => `<option value="${x.id}">${escapeHtml(x.name)}</option>`));
      $sel.innerHTML = opt.join('');
    }

    function resetAttrUI() {
      $attrLoading.textContent = '尚未加载属性...';
      $attrLoading.classList.remove('hidden');
      $attrList.classList.add('hidden');
      $attrCards.innerHTML = '';
      $counter.textContent = '';
    }

    // 获取属性
    let ATTR_ALL = []; // 全量属性缓存
    async function loadAttributes(description_category_id, type_id, language) {
      try {
        $tips.textContent = `正在获取属性（category_id=${description_category_id}, type_id=${type_id}）...`;
        $attrLoading.textContent = '正在获取属性...';
        $attrLoading.classList.remove('hidden');
        $attrList.classList.add('hidden');

        const payload = {
          description_category_id,
          type_id,
          language: language || 'ZH_HANS'
        };
        const resp = await ozon('/v1/description-category/attribute', payload);
        const list = (resp && resp.result) || [];

        // 统一结构
        ATTR_ALL = list.map(a => ({
          id: a.id,
          name: a.name,
          description: a.description || '',
          type: a.type,                   // string, bool, option, number 等
          is_required: !!a.is_required,
          is_collection: !!a.is_collection,
          dictionary_id: a.dictionary_id || 0,
          group_name: a.group_name || '',
          group_id: a.group_id || 0
        }));

        renderAttributes(ATTR_ALL);
        $attrLoading.classList.add('hidden');
        $attrList.classList.remove('hidden');
        $tips.textContent = `属性已加载：共 ${ATTR_ALL.length} 项`;
      } catch (e) {
        $tips.textContent = '属性获取失败：' + e.message;
        $attrLoading.textContent = '属性获取失败：' + e.message;
        $attrLoading.classList.remove('hidden');
        $attrList.classList.add('hidden');
      }
    }

    function renderAttributes(list) {
      $attrCards.innerHTML = '';
      let filtered = list.slice();

      // 仅必填
      if ($onlyRequired.checked) {
        filtered = filtered.filter(x => x.is_required);
      }
      // 搜索
      const kw = ($attrSearch.value || '').trim().toLowerCase();
      if (kw) {
        filtered = filtered.filter(x => (x.name || '').toLowerCase().includes(kw));
      }

      $counter.textContent = `显示 ${filtered.length} / 共 ${list.length} 项`;

      if (!filtered.length) {
        $attrCards.innerHTML = `<div class="text-sm text-gray-400">暂无符合条件的属性</div>`;
        return;
      }

      const frag = document.createDocumentFragment();
      filtered.forEach(a => {
        const card = document.createElement('div');
        card.className = 'border rounded-lg p-3';

        const tag = a.is_required
          ? `<span class="inline-block text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded">必填</span>`
          : `<span class="inline-block text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">选填</span>`;

        const dict = a.dictionary_id > 0
          ? `<button class="ml-2 text-xs px-2 py-1 rounded bg-indigo-600 text-white hover:bg-indigo-700" data-dict="${a.id}">加载字典值</button>`
          : `<span class="ml-2 text-xs text-gray-400">无字典</span>`;

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="font-medium">${escapeHtml(a.name)} ${tag}</div>
            <div class="text-xs text-gray-500">类型: ${escapeHtml(a.type || '')}，属性ID: ${a.id}</div>
          </div>
          <div class="text-xs text-gray-500 mt-1">${escapeHtml(a.description || '')}</div>
          <div class="text-xs text-gray-500 mt-1">分组：${escapeHtml(a.group_name || '')}</div>
          <div class="mt-2">${dict}
            <input class="ml-2 text-xs border rounded px-2 py-1 w-48" placeholder="搜索字典值..." data-search="${a.id}" />
          </div>
          <div class="mt-2 text-xs" id="dict-${a.id}"></div>
        `;
        frag.appendChild(card);
      });
      $attrCards.appendChild(frag);

      // 绑定字典按钮
      [...$attrCards.querySelectorAll('button[data-dict]')].forEach(btn => {
        btn.addEventListener('click', async () => {
          const attrId = Number(btn.getAttribute('data-dict'));
          if (!(currentC2Id > 0 && currentTypeId > 0)) {
            alert('请先选择二级类目和三级类型');
            return;
          }
          await loadDictionary(attrId, currentC2Id, currentTypeId, currentLang);
        });
      });

      // 字典搜索
      [...$attrCards.querySelectorAll('input[data-search]')].forEach(inp => {
        inp.addEventListener('input', async (e) => {
          const attrId = Number(inp.getAttribute('data-search'));
          const kw = (e.target.value || '').trim();
          if (kw.length >= 2) {
            await searchDictionary(attrId, currentC2Id, currentTypeId, kw);
          }
        });
      });
    }

    function filterRender() {
      renderAttributes(ATTR_ALL);
    }

    // 拉取字典值（分页直到拿全，limit 2000）
    async function loadDictionary(attribute_id, description_category_id, type_id, language) {
      try {
        const $box = document.getElementById(`dict-${attribute_id}`);
        $box.innerHTML = `<div class="text-gray-500">正在加载字典值...</div>`;

        let last_value_id = 0;
        let all = [];
        while (true) {
          const payload = {
            attribute_id,
            description_category_id,
            language: language || 'ZH_HANS',
            last_value_id,
            limit: 2000,
            type_id
          };
          const resp = await ozon('/v1/description-category/attribute/values', payload);
          const items = (resp && resp.result) || [];
          all = all.concat(items);
          if (!resp.has_next) break;
          if (items.length) last_value_id = items[items.length - 1].id;
          else break;
        }

        if (!all.length) {
          $box.innerHTML = `<div class="text-gray-400">该属性暂无字典值</div>`;
          return;
        }

        const html = all
          .map(v => `<div class="border rounded px-2 py-1 mb-1 flex items-center justify-between">
            <div><span class="font-medium">${escapeHtml(v.value || '')}</span>
              ${v.info ? `<span class="ml-2 text-xs text-gray-500">${escapeHtml(v.info)}</span>` : ''}
            </div>
            ${v.picture ? `<a class="text-xs text-blue-600 hover:underline" href="${escapeAttr(v.picture)}" target="_blank">图片</a>` : ''}
          </div>`)
          .join('');
        $box.innerHTML = `<div class="text-xs text-gray-500 mb-1">共 ${all.length} 条</div>${html}`;
      } catch (e) {
        const $box = document.getElementById(`dict-${attribute_id}`);
        $box.innerHTML = `<div class="text-red-600 text-xs">字典加载失败：${escapeHtml(e.message || '')}</div>`;
      }
    }

    // 按值搜索字典（/search，limit 100）
    async function searchDictionary(attribute_id, description_category_id, type_id, value) {
      try {
        const $box = document.getElementById(`dict-${attribute_id}`);
        $box.innerHTML = `<div class="text-gray-500">搜索中...</div>`;
        const payload = {
          attribute_id,
          description_category_id,
          type_id,
          value,
          limit: 100
        };
        const resp = await ozon('/v1/description-category/attribute/values/search', payload);
        const items = (resp && resp.result) || [];
        if (!items.length) {
          $box.innerHTML = `<div class="text-gray-400">无匹配结果</div>`;
          return;
        }
        const html = items
          .map(v => `<div class="border rounded px-2 py-1 mb-1 flex items-center justify-between">
            <div><span class="font-medium">${escapeHtml(v.value || '')}</span>
              ${v.info ? `<span class="ml-2 text-xs text-gray-500">${escapeHtml(v.info)}</span>` : ''}
            </div>
            ${v.picture ? `<a class="text-xs text-blue-600 hover:underline" href="${escapeAttr(v.picture)}" target="_blank">图片</a>` : ''}
          </div>`)
          .join('');
        $box.innerHTML = html;
      } catch (e) {
        const $box = document.getElementById(`dict-${attribute_id}`);
        $box.innerHTML = `<div class="text-red-600 text-xs">搜索失败：${escapeHtml(e.message || '')}</div>`;
      }
    }

    // utils
    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
    }
    function escapeAttr(s){ return String(s || '').replace(/"/g, '&quot;'); }
  </script>
</body>
</html>
