<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Ozon 类目属性助手（中文类目三级下拉 + 自动标注必填/选填）</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f7f8fa;
      padding: 20px;
    }
    h2 { margin-bottom: 10px; }
    select, button {
      padding: 8px 10px;
      margin: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .required { color: red; }
    .optional { color: green; }
    pre {
      background: #f3f3f3;
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
      max-height: 400px;
    }
  </style>
</head>
<body>

  <h2>Ozon 类目属性助手（中文类目三级下拉 + 自动标注必填/选填）</h2>

  <div>
    <label>语言：</label>
    <select id="lang">
      <option value="ZH_HANS">ZH_HANS (中文)</option>
      <option value="RU">RU (俄语)</option>
      <option value="EN">EN (英语)</option>
    </select>

    <button id="getTree">获取类目树</button>
    <button id="forceTree">强制刷新类目</button>
    <label><input type="checkbox" id="showRequiredOnly"> 仅显示必填项</label>
  </div>

  <div>
    <select id="level1"><option>加载中...</option></select>
    <select id="level2"></select>
    <select id="level3"></select>
    <button id="loadAttr">刷新属性</button>
  </div>

  <h3>类目属性</h3>
  <div id="result">请选择三级类目后点击刷新属性</div>

  <script>
    const API_BASE = "https://your-vercel-proxy.vercel.app/api"; // ⚠️替换为你的 Vercel 代理地址
    const level1 = document.getElementById("level1");
    const level2 = document.getElementById("level2");
    const level3 = document.getElementById("level3");
    const resultDiv = document.getElementById("result");
    const showRequiredOnly = document.getElementById("showRequiredOnly");
    let categoryTree = [];

    // 初始化
    async function init() {
      const cache = localStorage.getItem("ozonCategoryTree");
      if (cache) {
        categoryTree = JSON.parse(cache);
        populateLevel1();
        console.log("已加载缓存类目树");
      } else {
        await fetchCategoryTree();
      }
    }

    // 获取类目树
    async function fetchCategoryTree(force = false) {
      const lang = document.getElementById("lang").value;
      if (!force && categoryTree.length) return;

      resultDiv.textContent = "正在加载类目树...";
      const res = await fetch(`${API_BASE}/description-category/tree`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ language: lang })
      });
      const json = await res.json();
      if (json?.result?.length) {
        categoryTree = json.result;
        localStorage.setItem("ozonCategoryTree", JSON.stringify(categoryTree));
        populateLevel1();
        resultDiv.textContent = "类目树加载成功 ✅";
      } else {
        resultDiv.textContent = "获取类目树失败：" + JSON.stringify(json);
      }
    }

    // 一级类目
    function populateLevel1() {
      level1.innerHTML = "";
      categoryTree.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat.description_category_id;
        opt.textContent = cat.category_name;
        level1.appendChild(opt);
      });
      populateLevel2();
    }

    // 二级类目
    function populateLevel2() {
      const selected1 = categoryTree.find(c => c.description_category_id == level1.value);
      level2.innerHTML = "";
      if (selected1 && selected1.children) {
        selected1.children.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.description_category_id;
          opt.textContent = c.category_name;
          level2.appendChild(opt);
        });
      }
      populateLevel3();
    }

    // 三级类目
    function populateLevel3() {
      const selected1 = categoryTree.find(c => c.description_category_id == level1.value);
      const selected2 = selected1?.children.find(c => c.description_category_id == level2.value);
      level3.innerHTML = "";
      if (selected2 && selected2.children) {
        selected2.children.forEach(t => {
          const opt = document.createElement("option");
          opt.value = t.type_id;
          opt.textContent = t.type_name;
          level3.appendChild(opt);
        });
      }
    }

    // 获取属性
    async function loadAttributes() {
      const lang = document.getElementById("lang").value;
      const selected1 = categoryTree.find(c => c.description_category_id == level1.value);
      const selected2 = selected1?.children.find(c => c.description_category_id == level2.value);
      const selected3 = selected2?.children.find(t => t.type_id == level3.value);
      if (!selected3) {
        resultDiv.textContent = "请选择完整的三级类目";
        return;
      }

      const categoryId = selected2?.description_category_id;
      resultDiv.textContent = "正在获取属性...";

      const res = await fetch(`${API_BASE}/description-category/attribute`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          language: lang,
          description_category_id: categoryId
        })
      });

      const json = await res.json();
      if (json?.result?.length) {
        renderAttributes(json.result);
      } else {
        resultDiv.textContent = "获取属性失败：" + JSON.stringify(json);
      }
    }

    // 渲染属性列表
    function renderAttributes(attrs) {
      const onlyReq = showRequiredOnly.checked;
      let html = "<ul>";
      attrs.forEach(attr => {
        const isReq = attr.is_required;
        if (onlyReq && !isReq) return;
        html += `<li class="${isReq ? 'required' : 'optional'}">
          ${attr.name} ${isReq ? '（必填）' : '（选填）'}
        </li>`;
      });
      html += "</ul>";
      resultDiv.innerHTML = html;
    }

    // 绑定事件
    level1.addEventListener("change", populateLevel2);
    level2.addEventListener("change", populateLevel3);
    document.getElementById("getTree").addEventListener("click", () => fetchCategoryTree(false));
    document.getElementById("forceTree").addEventListener("click", () => fetchCategoryTree(true));
    document.getElementById("loadAttr").addEventListener("click", loadAttributes);

    init();
  </script>
</body>
</html>
